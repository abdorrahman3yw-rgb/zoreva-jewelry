<link rel="icon" type="image/svg+xml" href="logo.svg">

<style>

:root{
--black:#111;
--gold:#b9975b;
--gold-dark:#92733c;
--cream:#f8f6f1;
--white:#fff;
--border:#e6e0d5;
--muted:#777;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
background:#fff;
color:var(--black);
font-family:'Montserrat',sans-serif;
overflow-x:hidden;
}

a{
color:inherit;
text-decoration:none;
}

button{
font-family:inherit;
}

img{
display:block;
max-width:100%;
}


/* =========================
   ANNOUNCEMENT
========================= */

.announcement-bar{
height:32px;
background:#111;
color:#fff;
display:flex;
align-items:center;
justify-content:center;
font-size:10px;
letter-spacing:1.5px;
text-transform:uppercase;
border-bottom:1px solid rgba(185,151,91,.35);
}


/* =========================
   HEADER
========================= */

header{
height:82px;
background:rgba(255,255,255,.97);
backdrop-filter:blur(16px);
border-bottom:1px solid rgba(0,0,0,.06);
position:sticky;
top:0;
z-index:1000;
}

.header-inner{
height:100%;
max-width:1400px;
margin:auto;
padding:0 30px;
display:grid;
grid-template-columns:1fr auto 1fr;
align-items:center;
}

.back-home{
display:flex;
align-items:center;
gap:9px;
font-size:9px;
letter-spacing:1.5px;
text-transform:uppercase;
color:#777;
transition:.3s;
width:max-content;
}

.back-home:hover{
color:var(--gold-dark);
}

.back-home span{
font-size:17px;
}

.brand{
display:flex;
align-items:center;
justify-content:center;
gap:10px;
}

.brand img{
width:58px;
height:58px;
object-fit:contain;
}

.brand-name{
font-family:'Cormorant Garamond',serif;
font-size:25px;
font-weight:600;
letter-spacing:3px;
}

.header-actions{
display:flex;
justify-content:flex-end;
}

.cart-btn{
width:44px;
height:44px;
border:0;
background:none;
cursor:pointer;
position:relative;
display:flex;
align-items:center;
justify-content:center;
}

.cart-svg{
width:23px;
height:23px;
fill:none;
stroke:#111;
stroke-width:1.5;
}

.cart-count{
position:absolute;
top:1px;
right:0;
width:17px;
height:17px;
border-radius:50%;
background:var(--gold);
color:#fff;
display:flex;
align-items:center;
justify-content:center;
font-size:9px;
font-weight:600;
}


/* =========================
   PRODUCT PAGE
========================= */

.product-page{
max-width:1400px;
margin:auto;
padding:55px 30px 100px;
}

.breadcrumb{
display:flex;
align-items:center;
gap:9px;
font-size:9px;
letter-spacing:1.4px;
text-transform:uppercase;
color:#999;
margin-bottom:35px;
}

.breadcrumb a:hover{
color:var(--gold-dark);
}

.product-layout{
display:grid;
grid-template-columns:1.08fr .92fr;
gap:80px;
align-items:start;
}


/* =========================
   IMAGE
========================= */

.product-gallery{
position:relative;
background:#f5f3ee;
overflow:hidden;
animation:fadeImage .8s ease both;
}

.product-gallery img{
width:100%;
aspect-ratio:1 / 1.08;
object-fit:cover;
transition:transform 1s ease;
}

.product-gallery:hover img{
transform:scale(1.025);
}

.image-badge{
position:absolute;
top:22px;
left:22px;
z-index:2;
background:#111;
color:#fff;
padding:10px 15px;
font-size:8px;
letter-spacing:2px;
text-transform:uppercase;
}


/* =========================
   PRODUCT DETAILS
========================= */

.product-details{
padding:35px 0 0;
animation:fadeDetails .9s .1s ease both;
}

.product-category{
font-size:9px;
color:var(--gold-dark);
letter-spacing:3px;
text-transform:uppercase;
margin-bottom:17px;
}

.product-title{
font-family:'Cormorant Garamond',serif;
font-size:64px;
font-weight:500;
line-height:.95;
margin-bottom:20px;
}

.product-price{
font-size:20px;
font-weight:500;
letter-spacing:1px;
margin-bottom:28px;
}

.gold-line{
width:60px;
height:1px;
background:var(--gold);
margin-bottom:28px;
}

.product-description{
max-width:520px;
color:#666;
font-size:12px;
line-height:2;
margin-bottom:32px;
}

.product-specs{
border-top:1px solid var(--border);
border-bottom:1px solid var(--border);
padding:18px 0;
margin-bottom:30px;
max-width:520px;
}

.spec{
display:flex;
justify-content:space-between;
align-items:center;
padding:9px 0;
font-size:10px;
}

.spec-label{
color:#888;
letter-spacing:1px;
}

.spec-value{
font-weight:500;
}


/* =========================
   ACTIONS
========================= */

.product-actions{
max-width:520px;
display:flex;
flex-direction:column;
gap:10px;
}

.add-cart{
height:55px;
border:1px solid #111;
background:#111;
color:#fff;
cursor:pointer;
font-size:9px;
letter-spacing:2px;
text-transform:uppercase;
transition:.3s;
}

.add-cart:hover{
background:var(--gold-dark);
border-color:var(--gold-dark);
}

.whatsapp-order{
height:55px;
border:1px solid var(--border);
background:#fff;
color:#111;
cursor:pointer;
font-size:9px;
letter-spacing:2px;
text-transform:uppercase;
transition:.3s;
}

.whatsapp-order:hover{
border-color:#111;
background:#fafafa;
}

.continue-shopping{
display:inline-flex;
align-items:center;
gap:8px;
margin-top:22px;
font-size:9px;
letter-spacing:1.5px;
text-transform:uppercase;
color:#777;
transition:.3s;
}

.continue-shopping:hover{
color:var(--gold-dark);
}


/* =========================
   DETAILS
========================= */

.product-story{
max-width:1400px;
margin:0 auto;
padding:80px 30px;
border-top:1px solid var(--border);
}

.story-inner{
max-width:800px;
}

.story-small{
font-size:9px;
letter-spacing:3px;
text-transform:uppercase;
color:var(--gold-dark);
margin-bottom:12px;
}

.story-title{
font-family:'Cormorant Garamond',serif;
font-size:46px;
font-weight:500;
margin-bottom:20px;
}

.story-text{
font-size:12px;
line-height:2;
color:#777;
}


/* =========================
   CART
========================= */

.cart-overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
z-index:3000;
opacity:0;
visibility:hidden;
transition:.3s;
}

.cart-overlay.active{
opacity:1;
visibility:visible;
}

.cart-panel{
position:fixed;
top:0;
right:-450px;
width:420px;
max-width:94%;
height:100vh;
background:#fff;
z-index:3100;
transition:.45s ease;
display:flex;
flex-direction:column;
border-radius:22px 0 0 22px;
box-shadow:-15px 0 45px rgba(0,0,0,.13);
}

.cart-panel.active{
right:0;
}

.cart-header{
padding:25px;
border-bottom:1px solid var(--border);
display:flex;
justify-content:space-between;
align-items:center;
}

.cart-header h2{
font-family:'Cormorant Garamond',serif;
font-size:30px;
font-weight:500;
}

.cart-close{
width:36px;
height:36px;
border:1px solid var(--border);
border-radius:50%;
background:#fff;
cursor:pointer;
font-size:20px;
}

.cart-items{
flex:1;
overflow-y:auto;
padding:10px 22px;
}

.cart-empty{
text-align:center;
color:#888;
font-size:12px;
padding:70px 20px;
}

.cart-item{
display:grid;
grid-template-columns:72px 1fr 30px;
gap:14px;
padding:18px 0;
border-bottom:1px solid var(--border);
align-items:center;
}

.cart-item img{
width:72px;
height:72px;
object-fit:cover;
background:#f7f5f0;
}

.cart-item h4{
font-family:'Cormorant Garamond',serif;
font-size:19px;
font-weight:500;
margin-bottom:5px;
}

.cart-item p{
font-size:10px;
color:#777;
}

.remove-item{
width:28px;
height:28px;
border:0;
border-radius:50%;
background:#f5f3ef;
cursor:pointer;
font-size:16px;
color:#777;
}

.cart-footer{
padding:20px 22px 24px;
border-top:1px solid var(--border);
background:#fff;
}

.cart-total{
display:flex;
justify-content:space-between;
margin-bottom:17px;
font-size:13px;
}

.checkout-btn{
width:100%;
height:52px;
border:0;
background:#111;
color:#fff;
cursor:pointer;
font-size:10px;
letter-spacing:2px;
text-transform:uppercase;
transition:.3s;
}

.checkout-btn:hover{
background:var(--gold-dark);
}


/* =========================
   WHATSAPP
========================= */

.whatsapp-float{
position:fixed;
right:24px;
bottom:24px;
width:58px;
height:58px;
border-radius:50%;
background:#25D366;
display:flex;
align-items:center;
justify-content:center;
z-index:2500;
box-shadow:0 8px 25px rgba(0,0,0,.18);
transition:.3s;
}

.whatsapp-float:hover{
transform:translateY(-4px) scale(1.04);
}

.whatsapp-float svg{
width:31px;
height:31px;
fill:#fff;
}


/* =========================
   FOOTER
========================= */

footer{
background:#111;
color:#fff;
padding:60px 30px 30px;
}

.footer-inner{
max-width:1400px;
margin:auto;
}

.footer-logo{
display:flex;
align-items:center;
justify-content:center;
gap:10px;
margin-bottom:18px;
}

.footer-logo img{
width:55px;
height:55px;
object-fit:contain;
}

.footer-logo span{
font-family:'Cormorant Garamond',serif;
font-size:28px;
letter-spacing:4px;
}

.footer-text{
text-align:center;
color:#888;
font-size:9px;
letter-spacing:1px;
}

.copyright{
text-align:center;
color:#666;
font-size:8px;
letter-spacing:1px;
margin-top:35px;
padding-top:25px;
border-top:1px solid rgba(255,255,255,.1);
}


/* =========================
   ANIMATION
========================= */

@keyframes fadeImage{

from{
opacity:0;
transform:translateX(-20px);
}

to{
opacity:1;
transform:translateX(0);
}

}

@keyframes fadeDetails{

from{
opacity:0;
transform:translateY(20px);
}

to{
opacity:1;
transform:translateY(0);
}

}


/* =========================
   TABLET
========================= */

@media(max-width:900px){

.product-layout{
grid-template-columns:1fr;
gap:35px;
}

.product-details{
padding:5px 0;
}

.product-title{
font-size:54px;
}

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

.announcement-bar{
height:32px;
font-size:8px;
letter-spacing:1px;
}

header{
height:72px;
}

.header-inner{
padding:0 16px;
}

.brand img{
width:46px;
height:46px;
}

.brand-name{
font-size:19px;
letter-spacing:1.5px;
}

.back-home{
font-size:8px;
}

.back-home span{
font-size:15px;
}

.cart-btn{
width:40px;
height:40px;
}

.product-page{
padding:30px 16px 70px;
}

.breadcrumb{
font-size:8px;
margin-bottom:22px;
}

.product-layout{
gap:25px;
}

.product-gallery img{
aspect-ratio:1 / 1.08;
}

.image-badge{
top:14px;
left:14px;
padding:8px 11px;
font-size:7px;
}

.product-details{
padding:0;
}

.product-category{
font-size:8px;
letter-spacing:2.5px;
}

.product-title{
font-size:45px;
margin-bottom:15px;
}

.product-price{
font-size:18px;
margin-bottom:23px;
}

.product-description{
font-size:11px;
line-height:1.9;
}

.product-specs{
margin-bottom:24px;
}

.spec{
font-size:9px;
}

.add-cart,
.whatsapp-order{
height:52px;
}

.product-story{
padding:60px 16px;
}

.story-title{
font-size:38px;
}

.story-text{
font-size:11px;
}

.whatsapp-float{
width:54px;
height:54px;
right:16px;
bottom:16px;
}

.cart-panel{
width:100%;
max-width:100%;
border-radius:20px 0 0 20px;
}

}


/* =========================
   VERY SMALL PHONES
========================= */

@media(max-width:380px){

.product-title{
font-size:39px;
}

.brand-name{
font-size:17px;
}

.product-page{
padding-left:12px;
padding-right:12px;
}

}

</style>

</head>

/* =========================================
   ADD CURRENT PRODUCT
========================================= */

function addCurrentProduct(){

if(!product){
return;
}

addToCart(product,1);

const button =
document.querySelector(".add-cart");

if(button){

button.textContent="Ajouté au panier";

setTimeout(()=>{

button.textContent="Ajouter au panier";

},1300);

}

}


/* =========================================
   WHATSAPP CURRENT PRODUCT
========================================= */

function orderCurrentProduct(){

if(!product){
return;
}

const message=
`Bonjour ZOREVA,

Je souhaite commander :

Produit : ${product.name}
Catégorie : ${product.category}
Prix : ${product.price} DH

Merci.`;


const url=
"https://wa.me/212765333754?text="+
encodeURIComponent(message);


window.open(url,"_blank");

}


/* =========================================
   CART
========================================= */

let cart=
JSON.parse(localStorage.getItem("zorevaCart"))||[];


function saveCart(){

localStorage.setItem(
"zorevaCart",
JSON.stringify(cart)
);

}


function updateCartCount(){

const count=
cart.reduce(
(total,item)=>total+item.quantity,
0
);

document.getElementById(
"cartCount"
).textContent=count;

}


function addToCart(product,quantity=1){

const existing=
cart.find(item=>item.id===product.id);


if(existing){

existing.quantity+=quantity;

}else{

cart.push({

id:product.id,

name:product.name,

price:product.price,

image:product.image,

quantity:quantity

});

}


saveCart();

updateCartCount();

renderCart();

openCart();

}


function removeFromCart(id){

cart=
cart.filter(item=>item.id!==id);

saveCart();

updateCartCount();

renderCart();

}


function renderCart(){

const container=
document.getElementById("cartItems");


if(cart.length===0){

container.innerHTML=`
<div class="cart-empty">
Votre panier est vide.
</div>
`;

document.getElementById(
"cartTotal"
).textContent="0 DH";

return;

}


container.innerHTML="";

let total=0;


cart.forEach(item=>{

const subtotal=
item.price*item.quantity;

total+=subtotal;


const div=
document.createElement("div");

div.className="cart-item";


div.innerHTML=`

<img
src="${item.image}"
alt="${item.name}"
>

<div>

<h4>
${item.name}
</h4>

<p>
${item.quantity} × ${item.price} DH
</p>

</div>

<button
class="remove-item"
onclick="removeFromCart(${item.id})"
>
×
</button>

`;


container.appendChild(div);

});


document.getElementById(
"cartTotal"
).textContent=
`${total} DH`;

}


/* =========================================
   OPEN CART
========================================= */

const cartPanel=
document.getElementById("cartPanel");

const cartOverlay=
document.getElementById("cartOverlay");


function openCart(){

cartPanel.classList.add("active");

cartOverlay.classList.add("active");

}


function closeCart(){

cartPanel.classList.remove("active");

cartOverlay.classList.remove("active");

}


document
.getElementById("cartBtn")
.addEventListener(
"click",
openCart
);


document
.getElementById("cartClose")
.addEventListener(
"click",
closeCart
);


cartOverlay.addEventListener(
"click",
closeCart
);


/* =========================================
   CHECKOUT
========================================= */

document
.getElementById("checkoutBtn")
.addEventListener("click",()=>{


if(cart.length===0){

alert("Votre panier est vide.");

return;

}


let message=
"Bonjour ZOREVA, je souhaite passer une commande :\n\n";


let total=0;


cart.forEach(item=>{

const subtotal=
item.price*item.quantity;

total+=subtotal;


message+=
`${item.name} — ${item.quantity} × ${item.price} DH = ${subtotal} DH\n`;

});


message+=
`\nTotal : ${total} DH`;


window.open(

"https://wa.me/212765333754?text="+
encodeURIComponent(message),

"_blank"

);

});


/* =========================================
   INITIALIZE
========================================= */

renderProduct();

updateCartCount();

renderCart();

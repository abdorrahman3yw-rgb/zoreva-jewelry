<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Produit — ZOREVA Jewelry</title>

  <meta
    name="description"
    content="Découvrez les bijoux ZOREVA Jewelry."
  >

  <link rel="stylesheet" href="style.css">

  <style>
    /* =========================
       PRODUCT PAGE
    ========================= */

    .product-page {
      background: #faf9f6;
      min-height: 100vh;
      padding: 120px 6% 80px;
    }

    .product-container {
      max-width: 1200px;
      margin: auto;
    }

    .back-link {
      display: inline-block;
      color: #111;
      text-decoration: none;
      font-size: 13px;
      letter-spacing: .5px;
      margin-bottom: 35px;
      transition: .25s;
    }

    .back-link:hover {
      color: #b08a45;
    }

    .product-main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 70px;
      align-items: center;
    }

    .product-image-box {
      background: #fff;
      border: 1px solid #e8e3da;
      min-height: 600px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 35px;
    }

    .product-image-box img {
      width: 100%;
      height: 520px;
      object-fit: contain;
      display: block;
    }

    .product-info {
      padding: 10px 0;
    }

    .product-category {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #b08a45;
      margin-bottom: 15px;
    }

    .product-info h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 52px;
      font-weight: 400;
      line-height: 1.1;
      margin: 0 0 20px;
      color: #111;
    }

    .product-price {
      font-size: 24px;
      font-weight: 500;
      color: #111;
      margin-bottom: 25px;
    }

    .product-description {
      color: #666;
      font-size: 15px;
      line-height: 1.9;
      margin-bottom: 30px;
      max-width: 500px;
    }

    .product-details {
      border-top: 1px solid #e8e3da;
      border-bottom: 1px solid #e8e3da;
      padding: 22px 0;
      margin-bottom: 30px;
    }

    .product-details p {
      margin: 8px 0;
      font-size: 13px;
      color: #555;
    }

    .product-details strong {
      color: #111;
    }

    .quantity-area {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .quantity-label {
      font-size: 13px;
      color: #111;
    }

    .quantity-control {
      display: flex;
      align-items: center;
      border: 1px solid #d9d3c8;
      background: #fff;
    }

    .quantity-control button {
      width: 40px;
      height: 40px;
      border: none;
      background: #fff;
      color: #111;
      font-size: 18px;
      cursor: pointer;
    }

    .quantity-control span {
      width: 40px;
      text-align: center;
      font-size: 14px;
    }

    .product-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 500px;
    }

    .add-product-btn,
    .whatsapp-product-btn {
      width: 100%;
      min-height: 52px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      transition: .25s;
      box-sizing: border-box;
    }

    .add-product-btn {
      background: #111;
      color: #fff;
    }

    .add-product-btn:hover {
      background: #b08a45;
    }

    .whatsapp-product-btn {
      background: #fff;
      color: #111;
      border: 1px solid #111;
    }

    .whatsapp-product-btn:hover {
      background: #111;
      color: #fff;
    }

    /* =========================
       RELATED PRODUCTS
    ========================= */

    .related-products {
      max-width: 1200px;
      margin: 100px auto 0;
    }

    .related-header {
      text-align: center;
      margin-bottom: 45px;
    }

    .related-header span {
      display: block;
      color: #b08a45;
      font-size: 11px;
      letter-spacing: 3px;
      margin-bottom: 12px;
    }

    .related-header h2 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 38px;
      font-weight: 400;
      color: #111;
      margin: 0;
    }

    .related-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }

    .related-card {
      background: #fff;
      border: 1px solid #e8e3da;
      text-decoration: none;
      color: #111;
      transition: .25s;
      overflow: hidden;
    }

    .related-card:hover {
      transform: translateY(-4px);
    }

    .related-image {
      height: 320px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .related-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .related-info {
      padding: 20px;
      text-align: center;
      border-top: 1px solid #e8e3da;
    }

    .related-info h3 {
      margin: 0 0 8px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 20px;
      font-weight: 400;
    }

    .related-info p {
      margin: 0;
      font-size: 14px;
      color: #777;
    }

    /* =========================
       NOT FOUND
    ========================= */

    .product-not-found {
      min-height: 60vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .product-not-found h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 45px;
      font-weight: 400;
      margin-bottom: 15px;
    }

    .product-not-found p {
      color: #777;
      margin-bottom: 25px;
    }

    .product-not-found a {
      background: #111;
      color: #fff;
      text-decoration: none;
      padding: 14px 25px;
      font-size: 12px;
      letter-spacing: 1px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 800px) {

      .product-page {
        padding: 100px 5% 60px;
      }

      .product-main {
        grid-template-columns: 1fr;
        gap: 40px;
      }

      .product-image-box {
        min-height: 400px;
        padding: 20px;
      }

      .product-image-box img {
        height: 360px;
      }

      .product-info h1 {
        font-size: 40px;
      }

      .related-grid {
        grid-template-columns: 1fr;
      }

      .related-image {
        height: 350px;
      }
    }

    @media (max-width: 480px) {

      .product-page {
        padding-left: 18px;
        padding-right: 18px;
      }

      .product-image-box {
        min-height: 330px;
      }

      .product-image-box img {
        height: 300px;
      }

      .product-info h1 {
        font-size: 34px;
      }

      .product-price {
        font-size: 21px;
      }

      .related-header h2 {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================= -->

  <header class="site-header">

    <div class="header-inner">

      <a href="index.html" class="logo">
        <strong>ZOREVA</strong>
        <span>JEWELRY</span>
      </a>

      <nav class="main-nav">
        <a href="index.html">Accueil</a>
        <a href="index.html#collections">Collections</a>
        <a href="index.html#products">Bijoux</a>
        <a href="index.html#about">À propos</a>
        <a href="index.html#contact">Contact</a>
      </nav>

      <button
        class="cart-btn"
        onclick="goToCart()"
        type="button"
      >
        Panier
        <span id="cartCount">0</span>
      </button>

    </div>

  </header>


  <!-- =========================
       PRODUCT
  ========================= -->

  <main class="product-page">

    <div class="product-container">

      <a href="index.html#products" class="back-link">
        ← Retour aux bijoux
      </a>

      <div id="productContent"></div>

    </div>

  </main>


  <!-- =========================
       FOOTER
  ========================= -->

  <footer class="site-footer">

    <div class="footer-inner">

      <div>
        <div class="logo">
          <strong>ZOREVA</strong>
          <span>JEWELRY</span>
        </div>

        <p>
          L'élégance, simplement.
        </p>
      </div>

      <div>
        <h4>Navigation</h4>
        <a href="index.html">Accueil</a>
        <a href="index.html#collections">Collections</a>
        <a href="index.html#products">Bijoux</a>
        <a href="index.html#contact">Contact</a>
      </div>

      <div>
        <h4>Contact</h4>
        <a
          href="https://wa.me/212765333754"
          target="_blank"
          rel="noopener"
        >
          WhatsApp
        </a>
      </div>

    </div>

    <div class="footer-bottom">
      © 2026 ZOREVA Jewelry — Tous droits réservés.
    </div>

  </footer>


  <!-- =========================
       JAVASCRIPT
  ========================= -->

  <script>

    /* =========================
       PRODUCTS
    ========================= */

    const products = {

      "collier-eclat": {
        name: "Collier Éclat",
        price: 119,
        category: "Collier",
        image: "https://raw.githubusercontent.com/abdorrahman3yw-rgb/zoreva-jewelry/main/IMG_20260726_171518.jpg",
        description:
          "Un collier élégant au design raffiné, pensé pour apporter une touche lumineuse et sophistiquée à votre style."
      },

      "bague-elegance": {
        name: "Bague Élégance",
        price: 119,
        category: "Bague",
        image: "https://raw.githubusercontent.com/abdorrahman3yw-rgb/zoreva-jewelry/main/IMG_20260726_171656.jpg",
        description:
          "Une bague délicate et élégante, idéale pour compléter votre look avec une touche chic et intemporelle."
      },

      "bracelet-luna": {
        name: "Bracelet Luna",
        price: 149,
        category: "Bracelet",
        image: "https://raw.githubusercontent.com/abdorrahman3yw-rgb/zoreva-jewelry/main/IMG_20260726_171921.jpg",
        description:
          "Un bracelet raffiné au style moderne, parfait pour accompagner vos tenues au quotidien."
      },

      "bague-signature": {
        name: "Bague Signature",
        price: 149,
        category: "Bague",
        image: "https://raw.githubusercontent.com/abdorrahman3yw-rgb/zoreva-jewelry/main/IMG_20260726_175331.jpg",
        description:
          "Une pièce élégante avec une présence unique, conçue pour celles et ceux qui apprécient les détails raffinés."
      },

      "collier-perla": {
        name: "Collier Perla",
        price: 149,
        category: "Collier",
        image: "https://raw.githubusercontent.com/abdorrahman3yw-rgb/zoreva-jewelry/main/IMG_20260726_180004.jpg",
        description:
          "Un collier chic et délicat qui apporte une finition élégante à votre tenue."
      },

      "bracelet-elegance": {
        name: "Bracelet Élégance",
        price: 149,
        category: "Bracelet",
        image: "https://raw.githubusercontent.com/abdorrahman3yw-rgb/zoreva-jewelry/main/IMG_20260726_180304.jpg",
        description:
          "Un bracelet sophistiqué au style épuré, facile à porter seul ou avec d'autres bijoux."
      },

      "bague-royale": {
        name: "Bague Royale",
        price: 149,
        category: "Bague",
        image: "https://raw.githubusercontent.com/abdorrahman3yw-rgb/zoreva-jewelry/main/IMG_20260726_180430.jpg",
        description:
          "Une bague au caractère élégant et distingué, idéale pour ajouter une touche premium à votre style."
      }

    };


    /* =========================
       GET PRODUCT
    ========================= */

    const params = new URLSearchParams(window.location.search);

    const productId = params.get("product");

    const product = products[productId];


    /* =========================
       CART
    ========================= */

    let cart =
      JSON.parse(localStorage.getItem("zorevaCart")) || [];


    function saveCart() {

      localStorage.setItem(
        "zorevaCart",
        JSON.stringify(cart)
      );

    }


    function updateCartCount() {

      const countElement =
        document.getElementById("cartCount");

      if (!countElement) return;

      const total =
        cart.reduce(
          (sum, item) => sum + item.quantity,
          0
        );

      countElement.textContent = total;

    }


    function addToCart(productId, quantity = 1) {

      const selectedProduct =
        products[productId];

      if (!selectedProduct) return;


      const existing =
        cart.find(
          item => item.id === productId
        );


      if (existing) {

        existing.quantity += quantity;

      } else {

        cart.push({

          id: productId,

          name: selectedProduct.name,

          price: selectedProduct.price,

          image: selectedProduct.image,

          quantity: quantity

        });

      }


      saveCart();

      updateCartCount();

      alert("Produit ajouté au panier.");

    }


    function buyOnWhatsApp(productId, quantity) {

      const selectedProduct =
        products[productId];

      if (!selectedProduct) return;


      const total =
        selectedProduct.price * quantity;


      const message =
        `Bonjour ZOREVA Jewelry,%0A%0A` +
        `Je souhaite commander :%0A` +
        `${selectedProduct.name}%0A` +
        `Quantité : ${quantity}%0A` +
        `Prix total : ${total} DH%0A%0A` +
        `Merci.`;


      window.open(
        `https://wa.me/212765333754?text=${message}`,
        "_blank"
      );

    }


    function goToCart() {

      window.location.href = "index.html#cart";

    }


    /* =========================
       SHOW PRODUCT
    ========================= */

    function renderProduct() {

      const container =
        document.getElementById("productContent");


      if (!product) {

        container.innerHTML = `

          <div class="product-not-found">

            <h1>Produit introuvable</h1>

            <p>
              Ce produit n'existe pas ou le lien est incorrect.
            </p>

            <a href="index.html#products">
              Retour aux bijoux
            </a>

          </div>

        `;

        return;

      }


      document.title =
        `${product.name} — ZOREVA Jewelry`;


      container.innerHTML = `

        <div class="product-main">

          <div class="product-image-box">

            <img
              src="${product.image}"
              alt="${product.name}"
            >

          </div>


          <div class="product-info">

            <div class="product-category">
              ${product.category}
            </div>

            <h1>
              ${product.name}
            </h1>

            <div class="product-price">
              ${product.price} DH
            </div>

            <p class="product-description">
              ${product.description}
            </p>


            <div class="product-details">

              <p>
                <strong>Catégorie :</strong>
                ${product.category}
              </p>

              <p>
                <strong>Disponibilité :</strong>
                Disponible
              </p>

              <p>
                <strong>Livraison :</strong>
                Commande via WhatsApp
              </p>

            </div>


            <div class="quantity-area">

              <span class="quantity-label">
                Quantité
              </span>

              <div class="quantity-control">

                <button
                  type="button"
                  onclick="changeQuantity(-1)"
                >
                  −
                </button>

                <span id="quantity">
                  1
                </span>

                <button
                  type="button"
                  onclick="changeQuantity(1)"
                >
                  +
                </button>

              </div>

            </div>


            <div class="product-actions">

              <button
                type="button"
                class="add-product-btn"
                onclick="handleAddToCart()"
              >
                Ajouter au panier
              </button>


              <a
                href="#"
                class="whatsapp-product-btn"
                onclick="handleWhatsApp(event)"
              >
                Commander sur WhatsApp
              </a>

            </div>

          </div>

        </div>


        <section class="related-products">

          <div class="related-header">

            <span>
              ZOREVA JEWELRY
            </span>

            <h2>
              Vous pourriez aussi aimer
            </h2>

          </div>

          <div
            class="related-grid"
            id="relatedProducts"
          ></div>

        </section>

      `;


      renderRelatedProducts();

    }


    /* =========================
       QUANTITY
    ========================= */

    let quantity = 1;


    function changeQuantity(change) {

      quantity += change;


      if (quantity < 1) {
        quantity = 1;
      }


      if (quantity > 20) {
        quantity = 20;
      }


      document.getElementById(
        "quantity"
      ).textContent = quantity;

    }


    /* =========================
       ADD TO CART
    ========================= */

    function handleAddToCart() {

      addToCart(
        productId,
        quantity
      );

    }


    /* =========================
       WHATSAPP
    ========================= */

    function handleWhatsApp(event) {

      event.preventDefault();

      buyOnWhatsApp(
        productId,
        quantity
      );

    }


    /* =========================
       RELATED PRODUCTS
    ========================= */

    function renderRelatedProducts() {

      const container =
        document.getElementById(
          "relatedProducts"
        );


      if (!container) return;


      const related =
        Object.entries(products)

          .filter(
            ([id]) => id !== productId
          )

          .slice(0, 3);


      container.innerHTML =
        related.map(
          ([id, item]) => `

            <a
              href="product.html?product=${id}"
              class="related-card"
            >

              <div class="related-image">

                <img
                  src="${item.image}"
                  alt="${item.name}"
                >

              </div>

              <div class="related-info">

                <h3>
                  ${item.name}
                </h3>

                <p>
                  ${item.price} DH
                </p>

              </div>

            </a>

          `
        ).join("");

    }


    /* =========================
       START
    ========================= */

    updateCartCount();

    renderProduct();

  </script>

</body>
</html>

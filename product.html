<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Produit — ZOREVA Jewelry</title>

<link rel="icon" type="image/svg+xml" href="logo.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

:root{
  --gold:#b8954c;
  --gold-dark:#927536;
  --black:#111111;
  --white:#ffffff;
  --cream:#faf9f6;
  --gray:#777;
  --border:#e8e5df;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  background:var(--white);
  color:var(--black);
  font-family:'Montserrat',sans-serif;
  font-weight:400;
}

button{
  font-family:inherit;
}

a{
  text-decoration:none;
  color:inherit;
}


/* =========================
   TOP BAR
========================= */

.announcement{
  height:34px;
  background:#111;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:9px;
  letter-spacing:2px;
  text-transform:uppercase;
}


/* =========================
   HEADER
========================= */

.header{
  height:82px;
  border-bottom:1px solid var(--border);
  background:rgba(255,255,255,.97);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 6%;
  position:sticky;
  top:0;
  z-index:100;
  backdrop-filter:blur(10px);
}

.logo{
  display:flex;
  align-items:center;
  gap:11px;
}

.logo img{
  width:38px;
  height:38px;
  object-fit:contain;
}

.logo span{
  font-family:'Cormorant Garamond',serif;
  font-size:29px;
  letter-spacing:4px;
  font-weight:600;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:14px;
}

.header-btn{
  border:1px solid var(--border);
  background:#fff;
  width:44px;
  height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:.3s;
  position:relative;
}

.header-btn:hover{
  border-color:var(--gold);
  color:var(--gold);
}

.cart-count{
  position:absolute;
  top:-5px;
  right:-5px;
  background:var(--gold);
  color:#fff;
  min-width:18px;
  height:18px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:9px;
}


/* =========================
   BREADCRUMB
========================= */

.breadcrumb{
  max-width:1250px;
  margin:0 auto;
  padding:25px 25px 10px;
  font-size:10px;
  letter-spacing:1px;
  color:#888;
  text-transform:uppercase;
}

.breadcrumb a{
  transition:.3s;
}

.breadcrumb a:hover{
  color:var(--gold);
}

.breadcrumb span{
  margin:0 8px;
  color:#bbb;
}


/* =========================
   PRODUCT
========================= */

.product-page{
  max-width:1250px;
  margin:0 auto;
  padding:25px 25px 100px;
}

.product-layout{
  display:grid;
  grid-template-columns:1.05fr .95fr;
  gap:75px;
  align-items:start;
}


/* =========================
   IMAGE
========================= */

.product-gallery{
  position:relative;
}

.product-main-image{
  width:100%;
  background:#f5f4f1;
  overflow:hidden;
  position:relative;
}

.product-main-image img{
  width:100%;
  display:block;
  aspect-ratio:1 / 1.08;
  object-fit:cover;
  transition:transform 1s ease;
}

.product-main-image:hover img{
  transform:scale(1.025);
}

.image-label{
  position:absolute;
  top:20px;
  left:20px;
  background:#111;
  color:#fff;
  padding:9px 14px;
  font-size:8px;
  letter-spacing:2px;
  text-transform:uppercase;
}


/* =========================
   PRODUCT DETAILS
========================= */

.product-details{
  padding:25px 0;
}

.product-category{
  color:var(--gold);
  font-size:10px;
  letter-spacing:3px;
  text-transform:uppercase;
  margin-bottom:17px;
}

.product-title{
  font-family:'Cormorant Garamond',serif;
  font-size:58px;
  line-height:1;
  font-weight:500;
  margin-bottom:20px;
}

.product-price{
  font-size:20px;
  font-weight:500;
  letter-spacing:1px;
  margin-bottom:28px;
}

.product-line{
  width:55px;
  height:1px;
  background:var(--gold);
  margin-bottom:28px;
}

.product-description{
  color:#666;
  font-size:13px;
  line-height:2;
  max-width:500px;
  margin-bottom:32px;
}

.product-info-box{
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
  padding:20px 0;
  margin-bottom:30px;
}

.info-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 0;
  font-size:11px;
}

.info-row span:first-child{
  color:#888;
  letter-spacing:1px;
}

.info-row span:last-child{
  font-weight:500;
}


/* =========================
   BUTTONS
========================= */

.product-actions{
  display:flex;
  flex-direction:column;
  gap:10px;
  max-width:500px;
}

.btn{
  width:100%;
  min-height:54px;
  border:1px solid #111;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:10px;
  letter-spacing:2px;
  text-transform:uppercase;
  transition:.3s;
}

.btn-cart{
  background:#111;
  color:#fff;
}

.btn-cart:hover{
  background:var(--gold-dark);
  border-color:var(--gold-dark);
}

.btn-whatsapp{
  background:#fff;
  color:#111;
  border-color:var(--border);
}

.btn-whatsapp:hover{
  border-color:#111;
  background:#fafafa;
}

.back-btn{
  margin-top:22px;
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-size:9px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:#777;
  transition:.3s;
}

.back-btn:hover{
  color:var(--gold);
}


/* =========================
   DETAILS SECTION
========================= */

.details-section{
  max-width:1250px;
  margin:0 auto;
  padding:70px 25px;
  border-top:1px solid var(--border);
}

.details-title{
  font-family:'Cormorant Garamond',serif;
  font-size:34px;
  font-weight:500;
  margin-bottom:20px;
}

.details-text{
  max-width:760px;
  color:#777;
  font-size:12px;
  line-height:2;
}


/* =========================
   CART PANEL
========================= */

.cart-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
  opacity:0;
  visibility:hidden;
  transition:.3s;
  z-index:200;
}

.cart-overlay.active{
  opacity:1;
  visibility:visible;
}

.cart-panel{
  position:absolute;
  right:0;
  top:0;
  height:100%;
  width:420px;
  max-width:90%;
  background:#fff;
  transform:translateX(100%);
  transition:.4s;
  display:flex;
  flex-direction:column;
}

.cart-overlay.active .cart-panel{
  transform:translateX(0);
}

.cart-header{
  padding:25px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.cart-header h2{
  font-family:'Cormorant Garamond',serif;
  font-size:28px;
  font-weight:500;
}

.close-cart{
  background:none;
  border:0;
  font-size:22px;
  cursor:pointer;
}

.cart-items{
  flex:1;
  overflow-y:auto;
  padding:20px;
}

.empty-cart{
  text-align:center;
  color:#888;
  font-size:11px;
  padding:50px 10px;
}

.cart-item{
  display:flex;
  gap:14px;
  padding:15px 0;
  border-bottom:1px solid var(--border);
}

.cart-item img{
  width:75px;
  height:85px;
  object-fit:cover;
  background:#f5f4f1;
}

.cart-item-info{
  flex:1;
}

.cart-item-name{
  font-family:'Cormorant Garamond',serif;
  font-size:19px;
  margin-bottom:5px;
}

.cart-item-price{
  font-size:11px;
  color:#777;
}

.cart-item-remove{
  border:0;
  background:none;
  color:#999;
  cursor:pointer;
  font-size:10px;
}

.cart-footer{
  border-top:1px solid var(--border);
  padding:20px;
}

.cart-total{
  display:flex;
  justify-content:space-between;
  margin-bottom:15px;
  font-size:13px;
}

.checkout-btn{
  width:100%;
  height:50px;
  border:0;
  background:#111;
  color:#fff;
  cursor:pointer;
  font-size:9px;
  letter-spacing:2px;
  text-transform:uppercase;
}

.checkout-btn:hover{
  background:var(--gold-dark);
}


/* =========================
   WHATSAPP
========================= */

.whatsapp-float{
  position:fixed;
  right:20px;
  bottom:20px;
  width:52px;
  height:52px;
  border-radius:50%;
  background:#111;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:150;
  box-shadow:0 8px 25px rgba(0,0,0,.18);
  transition:.3s;
}

.whatsapp-float:hover{
  background:var(--gold-dark);
  transform:translateY(-3px);
}

.whatsapp-float svg{
  width:22px;
  height:22px;
}


/* =========================
   FOOTER
========================= */

.footer{
  background:#111;
  color:#fff;
  text-align:center;
  padding:50px 20px;
}

.footer-logo{
  font-family:'Cormorant Garamond',serif;
  font-size:32px;
  letter-spacing:5px;
  margin-bottom:12px;
}

.footer-text{
  color:#aaa;
  font-size:9px;
  letter-spacing:1px;
}


/* =========================
   LOADING
========================= */

.loading{
  min-height:500px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  letter-spacing:2px;
  color:#888;
}


/* =========================
   MOBILE
========================= */

@media(max-width:900px){

  .product-layout{
    grid-template-columns:1fr;
    gap:30px;
  }

  .product-details{
    padding:10px 0;
  }

  .product-title{
    font-size:48px;
  }

}

@media(max-width:600px){

  .announcement{
    height:30px;
    font-size:7px;
    letter-spacing:1.3px;
  }

  .header{
    height:70px;
    padding:0 18px;
  }

  .logo img{
    width:32px;
    height:32px;
  }

  .logo span{
    font-size:23px;
    letter-spacing:3px;
  }

  .header-btn{
    width:40px;
    height:40px;
  }

  .breadcrumb{
    padding:20px 15px 5px;
  }

  .product-page{
    padding:15px 15px 70px;
  }

  .product-layout{
    gap:22px;
  }

  .product-title{
    font-size:42px;
  }

  .product-price{
    font-size:18px;
  }

  .product-description{
    font-size:12px;
    line-height:1.9;
  }

  .details-section{
    padding:50px 15px;
  }

  .details-title{
    font-size:29px;
  }

  .cart-panel{
    width:100%;
    max-width:100%;
  }

}


/* =========================
   ANIMATION
========================= */

.product-gallery{
  animation:fadeUp .7s ease both;
}

.product-details{
  animation:fadeUp .8s ease .1s both;
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(18px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

</style>
</head>


<body>


<div class="announcement">
  Livraison disponible partout au Maroc
</div>


<header class="header">

  <a href="index.html" class="logo">
    <img src="logo.svg" alt="ZOREVA Jewelry">
    <span>ZOREVA</span>
  </a>

  <div class="header-actions">

    <button class="header-btn" onclick="openCart()" aria-label="Panier">

      <svg width="19" height="19" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.5">
        <path d="M6 8h12l1 13H5L6 8Z"/>
        <path d="M9 8a3 3 0 0 1 6 0"/>
      </svg>

      <span class="cart-count" id="cartCount">0</span>

    </button>

  </div>

</header>


<div id="productContainer">

  <div class="loading">
    CHARGEMENT...
  </div>

</div>


<!-- CART -->

<div class="cart-overlay" id="cartOverlay">

  <div class="cart-panel">

    <div class="cart-header">

      <h2>Votre panier</h2>

      <button class="close-cart" onclick="closeCart()">×</button>

    </div>

    <div class="cart-items" id="cartItems"></div>

    <div class="cart-footer">

      <div class="cart-total">
        <span>Total</span>
        <strong id="cartTotal">0 DH</strong>
      </div>

      <button class="checkout-btn" onclick="checkout()">
        Commander sur WhatsApp
      </button>

    </div>

  </div>

</div>


<!-- WHATSAPP -->

<a
  class="whatsapp-float"
  href="https://wa.me/212765333754"
  target="_blank"
  aria-label="WhatsApp"
>

<svg viewBox="0 0 24 24" fill="none"
     stroke="currentColor"
     stroke-width="1.7">

  <path d="M20 11.5a8.3 8.3 0 0 1-12.4 7.2L4 20l1.3-3.5A8.3 8.3 0 1 1 20 11.5Z"/>

  <path d="M8.5 8.5c.2-.4.4-.5.7-.5h.5c.2 0 .4.1.5.4l.7 1.5c.1.2.1.4-.1.6l-.5.6c-.1.1-.1.3 0 .5.4.7 1 1.3 1.7 1.7.2.1.4.1.5 0l.6-.5c.2-.2.4-.2.6-.1l1.5.7c.2.1.3.3.3.5v.5c0 .3-.1.5-.5.7-.4.2-1 .3-1.5.1-1-.3-2.2-1-3.3-2.1-1-1-1.7-2.2-2.1-3.3-.2-.5-.1-1.1.1-1.5Z"/>

</svg>

</a>


<footer class="footer">

  <div class="footer-logo">
    ZOREVA
  </div>

  <div class="footer-text">
    Jewelry · Elegance · Details
  </div>

</footer>


<script>

/* =========================
   PRODUCTS
========================= */

const products = [

  {
    id:1,
    name:"Bijou 01",
    category:"Colliers",
    price:119,
    image:"https://raw.githubusercontent.com/abdorrahman3yw-rgb/zoreva-jewelry/main/IMG_20260726_171518.jpg"
  },

  {
    id:2,
    name:"Bijou 02",
    category:"Bagues",
    price:119,
    image:"https://raw.githubusercontent.com/abdorrahman3yw-rgb/zoreva-jewelry/main/IMG_20260726_171656.jpg"
  },

  {
    id:3,
    name:"Bijou 03",
    category:"Bracelets",
    price:149,
    image:"https://raw.githubusercontent.com/abdorrahman3yw-rgb/zoreva-jewelry/main/IMG_20260726_171921.jpg"
  },

  {
    id:4,
    name:"Bijou 04",
    category:"Bagues",
    price:149,
    image:"https://raw.githubusercontent.com/abdorrahman3yw-rgb/zoreva-jewelry/main/222/WhatsApp%20Image%202026-09-17%20at%2014.39.04%20%281%29.jpeg"
  },

  {
    id:5,
    name:"Bijou 05",
    category:"Colliers",
    price:149,
    image:"https://raw.githubusercontent.com/abdorrahman3yw-rgb/zoreva-jewelry/main/IMG_20260726_180004.jpg"
  },

  {
    id:6,
    name:"Bijou 06",
    category:"Bracelets",
    price:149,
    image:"https://raw.githubusercontent.com/abdorrahman3yw-rgb/zoreva-jewelry/main/IMG_20260726_180304.jpg"
  },

  {
    id:7,
    name:"Bijou 07",
    category:"Bagues",
    price:149,
    image:"https://raw.githubusercontent.com/abdorrahman3yw-rgb/zoreva-jewelry/main/IMG_20260726_180430.jpg"
  }

];


/* =========================
   GET PRODUCT
========================= */

const params = new URLSearchParams(window.location.search);

const productId = Number(params.get("id"));

const product = products.find(p => p.id === productId);


/* =========================
   SHOW PRODUCT
========================= */

function renderProduct(){

  const container = document.getElementById("productContainer");

  if(!product){

    container.innerHTML = `
      <div class="loading">
        PRODUIT INTROUVABLE
      </div>
    `;

    return;
  }


  document.title = `${product.name} — ZOREVA Jewelry`;


  container.innerHTML = `

    <div class="breadcrumb">

      <a href="index.html">Accueil</a>

      <span>/</span>

      <a href="index.html#products">Produits</a>

      <span>/</span>

      ${product.name}

    </div>


    <main class="product-page">

      <div class="product-layout">


        <div class="product-gallery">

          <div class="product-main-image">

            <span class="image-label">
              ZOREVA
            </span>

            <img
              src="${product.image}"
              alt="${product.name} — ZOREVA Jewelry"
            >

          </div>

        </div>


        <div class="product-details">

          <div class="product-category">
            ${product.category}
          </div>

          <h1 class="product-title">
            ${product.name}
          </h1>

          <div class="product-price">
            ${product.price} DH
          </div>

          <div class="product-line"></div>

          <p class="product-description">
            Une pièce élégante pensée pour apporter une touche
            raffinée à votre style. Chez ZOREVA, chaque détail
            est choisi pour créer une expérience simple,
            élégante et intemporelle.
          </p>


          <div class="product-info-box">

            <div class="info-row">
              <span>Catégorie</span>
              <span>${product.category}</span>
            </div>

            <div class="info-row">
              <span>Prix</span>
              <span>${product.price} DH</span>
            </div>

            <div class="info-row">
              <span>Disponibilité</span>
              <span>Disponible</span>
            </div>

            <div class="info-row">
              <span>Livraison</span>
              <span>Partout au Maroc</span>
            </div>

          </div>


          <div class="product-actions">

            <button
              class="btn btn-cart"
              onclick="addToCart(${product.id})"
            >
              Ajouter au panier
            </button>


            <button
              class="btn btn-whatsapp"
              onclick="orderProduct()"
            >
              Commander sur WhatsApp
            </button>

          </div>


          <a href="index.html#products" class="back-btn">
            ← Retour aux produits
          </a>

        </div>

      </div>

    </main>


    <section class="details-section">

      <h2 class="details-title">
        L'élégance dans chaque détail
      </h2>

      <p class="details-text">
        Découvrez cette pièce de la collection ZOREVA.
        Une sélection pensée pour accompagner vos looks
        avec élégance et simplicité. Ajoutez votre pièce
        au panier ou contactez-nous directement sur WhatsApp
        pour passer votre commande.
      </p>

    </section>

  `;

}


renderProduct();


/* =========================
   CART
========================= */

let cart = JSON.parse(localStorage.getItem("zorevaCart")) || [];


function saveCart(){

  localStorage.setItem(
    "zorevaCart",
    JSON.stringify(cart)
  );

}


function addToCart(id){

  const item = products.find(p => p.id === id);

  if(!item) return;


  const existing = cart.find(
    p => p.id === id
  );


  if(existing){

    existing.quantity += 1;

  }else{

    cart.push({
      ...item,
      quantity:1
    });

  }


  saveCart();

  updateCartCount();

  openCart();

}


function removeFromCart(id){

  cart = cart.filter(
    item => item.id !== id
  );

  saveCart();

  renderCart();

  updateCartCount();

}


function updateCartCount(){

  const count = cart.reduce(
    (total,item) => total + item.quantity,
    0
  );

  document.getElementById("cartCount").textContent = count;

}


function renderCart(){

  const container =
    document.getElementById("cartItems");


  if(cart.length === 0){

    container.innerHTML = `
      <div class="empty-cart">
        Votre panier est vide.
      </div>
    `;

    document.getElementById("cartTotal").textContent =
      "0 DH";

    return;
  }


  let total = 0;


  container.innerHTML = cart.map(item => {

    total += item.price * item.quantity;


    return `

      <div class="cart-item">

        <img
          src="${item.image}"
          alt="${item.name}"
        >

        <div class="cart-item-info">

          <div class="cart-item-name">
            ${item.name}
          </div>

          <div class="cart-item-price">
            ${item.price} DH × ${item.quantity}
          </div>

        </div>

        <button
          class="cart-item-remove"
          onclick="removeFromCart(${item.id})"
        >
          Supprimer
        </button>

      </div>

    `;

  }).join("");


  document.getElementById("cartTotal").textContent =
    `${total} DH`;

}


function openCart(){

  document
    .getElementById("cartOverlay")
    .classList.add("active");

  renderCart();

}


function closeCart(){

  document
    .getElementById("cartOverlay")
    .classList.remove("active");

}


/* =========================
   WHATSAPP PRODUCT ORDER
========================= */

function orderProduct(){

  if(!product) return;


  const message =
`Bonjour ZOREVA,

Je souhaite commander :

Produit : ${product.name}
Catégorie : ${product.category}
Prix : ${product.price} DH

Merci.`;


  const url =
    "https://wa.me/212765333754?text=" +
    encodeURIComponent(message);


  window.open(url,"_blank");

}


/* =========================
   CART CHECKOUT
========================= */

function checkout(){

  if(cart.length === 0){

    return;

  }


  let message =
`Bonjour ZOREVA,

Je souhaite commander :

`;


  let total = 0;


  cart.forEach(item => {

    const subtotal =
      item.price * item.quantity;

    total += subtotal;


    message +=
`${item.name} × ${item.quantity} — ${subtotal} DH
`;

  });


  message +=
`
Total : ${total} DH

Merci.`;


  const url =
    "https://wa.me/212765333754?text=" +
    encodeURIComponent(message);


  window.open(url,"_blank");

}

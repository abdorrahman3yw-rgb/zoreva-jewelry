<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Découvrez les bijoux ZOREVA Jewelry et commandez directement sur WhatsApp."
  >

  <title>Produit — ZOREVA Jewelry</title>

  <!-- FAVICON -->
  <link rel="icon" type="image/svg+xml" href="logo.svg">

  <link rel="stylesheet" href="style.css">

  <style>
    /* =========================================
       PRODUCT PAGE - ZOREVA PREMIUM
    ========================================= */

    .product-page {
      min-height: 100vh;
      padding: 130px 20px 90px;
    }

    .product-container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* =========================================
       LOGO
    ========================================= */

    .site-header .logo,
    .site-footer .logo {
      display: flex;
      align-items: center;
      gap: 11px;
      text-decoration: none;
    }

    .site-header .logo img,
    .site-footer .logo img {
      width: 42px;
      height: 42px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .site-header .logo > div,
    .site-footer .logo > div {
      display: flex;
      flex-direction: column;
      line-height: 1;
    }

    /* =========================================
       BACK
    ========================================= */

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 45px;
      text-decoration: none;
      color: inherit;
      font-size: 14px;
      transition: .3s ease;
    }

    .back-link:hover {
      color: #b8944e;
      transform: translateX(-4px);
    }

    /* =========================================
       PRODUCT MAIN
    ========================================= */

    .product-main {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(360px, .95fr);
      gap: 80px;
      align-items: center;
    }

    /* =========================================
       PRODUCT IMAGE
    ========================================= */

    .product-image-side {
      opacity: 0;
      transform: translateX(-50px);
      animation: productImageIn .9s cubic-bezier(.22,1,.36,1) .15s forwards;
    }

    .product-image-box {
      position: relative;
      width: 100%;
      min-height: 600px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #f7f3ea;
      border: 1px solid rgba(184,148,78,.25);
    }

    .product-image-box img {
      width: 100%;
      height: 600px;
      object-fit: contain;
      object-position: center;
      padding: 25px;
      display: block;
      transition: transform .7s cubic-bezier(.22,1,.36,1);
    }

    .product-image-box:hover img {
      transform: scale(1.035);
    }

    .product-image-label {
      position: absolute;
      top: 22px;
      left: 24px;
      z-index: 2;
      font-size: 10px;
      letter-spacing: 4px;
      color: #b8944e;
      font-weight: 600;
    }

    /* =========================================
       PRODUCT INFO
    ========================================= */

    .product-info {
      opacity: 0;
      transform: translateX(50px);
      animation: productInfoIn .9s cubic-bezier(.22,1,.36,1) .3s forwards;
    }

    .product-category {
      color: #b8944e;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .product-info h1 {
      margin: 0 0 15px;
      font-size: clamp(38px, 5vw, 62px);
      line-height: 1;
      font-weight: 500;
      letter-spacing: -1px;
    }

    .product-price {
      font-size: 23px;
      font-weight: 600;
      color: #b8944e;
      margin-bottom: 28px;
    }

    .product-divider {
      width: 70px;
      height: 1px;
      background: #b8944e;
      margin-bottom: 28px;
    }

    .product-description {
      max-width: 560px;
      line-height: 1.9;
      opacity: .72;
      font-size: 15px;
      margin-bottom: 32px;
    }

    /* =========================================
       DETAILS
    ========================================= */

    .product-details {
      border-top: 1px solid rgba(0,0,0,.12);
      border-bottom: 1px solid rgba(0,0,0,.12);
      margin-bottom: 30px;
    }

    .detail-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 15px 0;
      border-bottom: 1px solid rgba(0,0,0,.08);
      font-size: 13px;
    }

    .detail-row:last-child {
      border-bottom: 0;
    }

    .detail-row span {
      opacity: .55;
    }

    .detail-row strong {
      font-weight: 500;
    }

    /* =========================================
       QUANTITY
    ========================================= */

    .quantity-area {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 25px;
    }

    .quantity-label {
      font-size: 13px;
      opacity: .65;
    }

    .quantity-control {
      display: flex;
      align-items: center;
      border: 1px solid rgba(0,0,0,.15);
    }

    .quantity-control button {
      width: 42px;
      height: 42px;
      border: 0;
      background: transparent;
      cursor: pointer;
      font-size: 19px;
      transition: .25s ease;
    }

    .quantity-control button:hover {
      background: #b8944e;
      color: #fff;
    }

    .quantity-control span {
      min-width: 45px;
      text-align: center;
      font-size: 14px;
    }

    /* =========================================
       ACTIONS
    ========================================= */

    .product-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 35px;
    }

    .add-product-btn,
    .whatsapp-product-btn {
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 18px;
      border: 1px solid #111;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: .3s ease;
    }

    .add-product-btn {
      background: #111;
      color: #fff;
    }

    .add-product-btn:hover,
    .add-product-btn.added {
      background: #b8944e;
      border-color: #b8944e;
    }

    .whatsapp-product-btn {
      background: transparent;
      color: inherit;
    }

    .whatsapp-product-btn:hover {
      background: #b8944e;
      color: #fff;
      border-color: #b8944e;
    }

    /* =========================================
       TRUST
    ========================================= */

    .product-trust {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      border-top: 1px solid rgba(0,0,0,.1);
      padding-top: 25px;
    }

    .product-trust div {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .product-trust span {
      color: #b8944e;
      font-size: 10px;
      letter-spacing: 2px;
    }

    .product-trust p {
      margin: 0;
      font-size: 11px;
      opacity: .6;
      line-height: 1.4;
    }

    /* =========================================
       RELATED
    ========================================= */

    .related-products {
      margin-top: 120px;
      padding-top: 70px;
      border-top: 1px solid rgba(0,0,0,.1);
    }

    .related-header {
      text-align: center;
      margin-bottom: 45px;
      opacity: 0;
      transform: translateY(30px);
      animation: relatedHeaderIn .8s ease 1s forwards;
    }

    .related-header > span {
      display: block;
      color: #b8944e;
      font-size: 10px;
      letter-spacing: 4px;
      margin-bottom: 12px;
    }

    .related-header h2 {
      margin: 0;
      font-size: clamp(28px, 4vw, 42px);
      font-weight: 500;
    }

    .related-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }

    .related-card {
      text-decoration: none;
      color: inherit;
      opacity: 0;
      transform: translateY(35px);
      animation: relatedCardIn .7s cubic-bezier(.22,1,.36,1) forwards;
    }

    .related-card:nth-child(1) {
      animation-delay: 1.1s;
    }

    .related-card:nth-child(2) {
      animation-delay: 1.2s;
    }

    .related-card:nth-child(3) {
      animation-delay: 1.3s;
    }

    .related-image {
      position: relative;
      height: 380px;
      overflow: hidden;
      background: #f7f3ea;
      border: 1px solid rgba(184,148,78,.18);
    }

    .related-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 15px;
      transition: transform .6s cubic-bezier(.22,1,.36,1);
    }

    .related-card:hover .related-image img {
      transform: scale(1.04);
    }

    .related-view {
      position: absolute;
      left: 50%;
      bottom: 20px;
      transform: translate(-50%, 15px);
      padding: 10px 16px;
      background: #111;
      color: #fff;
      font-size: 10px;
      letter-spacing: 1px;
      opacity: 0;
      transition: .3s ease;
      white-space: nowrap;
    }

    .related-card:hover .related-view {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .related-info {
      padding-top: 17px;
    }

    .related-info > span {
      color: #b8944e;
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .related-info h3 {
      margin: 7px 0;
      font-size: 18px;
      font-weight: 500;
    }

    .related-info p {
      margin: 0;
      font-size: 14px;
      opacity: .65;
    }

    /* =========================================
       NOT FOUND
    ========================================= */

    .product-not-found {
      text-align: center;
      padding: 120px 20px;
      opacity: 0;
      animation: relatedHeaderIn .8s ease forwards;
    }

    .product-not-found-label {
      color: #b8944e;
      font-size: 10px;
      letter-spacing: 4px;
    }

    .product-not-found h1 {
      font-size: 45px;
      font-weight: 500;
      margin: 20px 0 15px;
    }

    .product-not-found p {
      opacity: .6;
      margin-bottom: 30px;
    }

    .product-not-found a {
      display: inline-flex;
      padding: 14px 25px;
      background: #111;
      color: #fff;
      text-decoration: none;
    }

    /* =========================================
       ANIMATIONS
    ========================================= */

    @keyframes productImageIn {
      from {
        opacity: 0;
        transform: translateX(-50px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes productInfoIn {
      from {
        opacity: 0;
        transform: translateX(50px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes relatedHeaderIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes relatedCardIn {
      from {
        opacity: 0;
        transform: translateY(35px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 850px) {

      .product-page {
        padding: 110px 16px 70px;
      }

      .product-main {
        grid-template-columns: 1fr;
        gap: 45px;
      }

      .product-image-box {
        min-height: 430px;
      }

      .product-image-box img {
        height: 430px;
        padding: 15px;
      }

      .product-info h1 {
        font-size: 42px;
      }

      .related-grid {
        grid-template-columns: 1fr;
        gap: 35px;
      }

      .related-image {
        height: 390px;
      }
    }

    @media (max-width: 600px) {

      .site-header .logo img,
      .site-footer .logo img {
        width: 36px;
        height: 36px;
      }

      .product-page {
        padding-top: 100px;
      }

      .back-link {
        margin-bottom: 25px;
      }

      .product-image-box {
        min-height: 360px;
      }

      .product-image-box img {
        height: 360px;
      }

      .product-info h1 {
        font-size: 36px;
      }

      .product-price {
        font-size: 21px;
      }

      .product-actions {
        grid-template-columns: 1fr;
      }

      .product-trust {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .related-products {
        margin-top: 80px;
        padding-top: 50px;
      }

      .related-image {
        height: 350px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }

    }
  </style>
</head>

  <!-- =========================================
       JAVASCRIPT
  ========================================= -->

  <script>

    /* =========================================
       PRODUCTS
    ========================================= */

    const products = {

      "collier-eclat": {
        name: "Collier Éclat",
        price: 119,
        category: "Collier",
        image: "https://raw.githubusercontent.com/abdorrahman3yw-rgb/zoreva-jewelry/main/IMG_20260726_171518.jpg",
        description:
          "Un collier élégant au design raffiné, pensé pour apporter une touche lumineuse et sophistiquée à votre style."
      },

      "bague-elegance": {
        name: "Bague Élégance",
        price: 119,
        category: "Bague",
        image: "https://raw.githubusercontent.com/abdorrahman3yw-rgb/zoreva-jewelry/main/IMG_20260726_171656.jpg",
        description:
          "Une bague délicate et élégante, idéale pour compléter votre look avec une touche chic et intemporelle."
      },

      "bracelet-luna": {
        name: "Bracelet Luna",
        price: 149,
        category: "Bracelet",
        image: "https://raw.githubusercontent.com/abdorrahman3yw-rgb/zoreva-jewelry/main/IMG_20260726_171921.jpg",
        description:
          "Un bracelet raffiné au style moderne, parfait pour accompagner vos tenues au quotidien."
      },

      "bague-signature": {
        name: "Bague Signature",
        price: 149,
        category: "Bague",
        image: "https://raw.githubusercontent.com/abdorrahman3yw-rgb/zoreva-jewelry/main/IMG_20260726_175331.jpg",
        description:
          "Une pièce élégante avec une présence unique, conçue pour celles et ceux qui apprécient les détails raffinés."
      },

      "collier-perla": {
        name: "Collier Perla",
        price: 149,
        category: "Collier",
        image: "https://raw.githubusercontent.com/abdorrahman3yw-rgb/zoreva-jewelry/main/IMG_20260726_180004.jpg",
        description:
          "Un collier chic et délicat qui apporte une finition élégante à votre tenue."
      },

      "bracelet-elegance": {
        name: "Bracelet Élégance",
        price: 149,
        category: "Bracelet",
        image: "https://raw.githubusercontent.com/abdorrahman3yw-rgb/zoreva-jewelry/main/IMG_20260726_180304.jpg",
        description:
          "Un bracelet sophistiqué au style épuré, facile à porter seul ou avec d'autres bijoux."
      },

      "bague-royale": {
        name: "Bague Royale",
        price: 149,
        category: "Bague",
        image: "https://raw.githubusercontent.com/abdorrahman3yw-rgb/zoreva-jewelry/main/IMG_20260726_180430.jpg",
        description:
          "Une bague au caractère élégant et distingué, idéale pour ajouter une touche premium à votre style."
      }

    };


    /* =========================================
       URL PRODUCT
    ========================================= */

    const params =
      new URLSearchParams(
        window.location.search
      );

    const productId =
      params.get("product");

    const product =
      products[productId];


    /* =========================================
       CART
    ========================================= */

    let cart =
      JSON.parse(
        localStorage.getItem("zorevaCart")
      ) || [];


    function saveCart() {

      localStorage.setItem(
        "zorevaCart",
        JSON.stringify(cart)
      );

    }


    function updateCartCount() {

      const countElement =
        document.getElementById(
          "cartCount"
        );

      if (!countElement) return;


      const total =
        cart.reduce(
          (sum, item) =>
            sum + item.quantity,
          0
        );


      countElement.textContent =
        total;

    }


    /* =========================================
       ADD TO CART
    ========================================= */

    function addToCart(
      productId,
      quantity = 1
    ) {

      const selectedProduct =
        products[productId];

      if (!selectedProduct) return;


      const existing =
        cart.find(
          item =>
            item.id === productId
        );


      if (existing) {

        existing.quantity += quantity;

      } else {

        cart.push({

          id: productId,

          name:
            selectedProduct.name,

          price:
            selectedProduct.price,

          image:
            selectedProduct.image,

          quantity:
            quantity

        });

      }


      saveCart();

      updateCartCount();

      showCartMessage();

    }


    /* =========================================
       CART MESSAGE
    ========================================= */

    function showCartMessage() {

      const button =
        document.querySelector(
          ".add-product-btn"
        );

      if (!button) return;


      const originalText =
        button.textContent;


      button.textContent =
        "Ajouté au panier ✓";


      button.classList.add(
        "added"
      );


      setTimeout(() => {

        button.textContent =
          originalText;

        button.classList.remove(
          "added"
        );

      }, 1800);

    }


    /* =========================================
       WHATSAPP
    ========================================= */

    function buyOnWhatsApp(
      productId,
      quantity
    ) {

      const selectedProduct =
        products[productId];

      if (!selectedProduct) return;


      const total =
        selectedProduct.price *
        quantity;


      const message =
        `Bonjour ZOREVA Jewelry,%0A%0A` +
        `Je souhaite commander :%0A%0A` +
        `Produit : ${selectedProduct.name}%0A` +
        `Quantité : ${quantity}%0A` +
        `Prix total : ${total} DH%0A%0A` +
        `Merci.`;


      window.open(
        `https://wa.me/212765333754?text=${message}`,
        "_blank"
      );

    }


    /* =========================================
       GO TO CART
    ========================================= */

    function goToCart() {

      window.location.href =
        "index.html#cart";

    }


    /* =========================================
       RENDER PRODUCT
    ========================================= */

    let quantity = 1;


    function renderProduct() {

      const container =
        document.getElementById(
          "productContent"
        );


      if (!product) {

        container.innerHTML = `

          <div class="product-not-found">

            <span class="product-not-found-label">
              ZOREVA JEWELRY
            </span>

            <h1>
              Produit introuvable
            </h1>

            <p>
              Ce produit n'existe pas
              ou le lien est incorrect.
            </p>

            <a href="index.html#products">
              Retour aux bijoux
            </a>

          </div>

        `;

        return;

      }


      document.title =
        `${product.name} — ZOREVA Jewelry`;


      container.innerHTML = `

        <div class="product-main">


          <!-- IMAGE -->

          <div class="product-image-side">

            <div class="product-image-box">

              <span class="product-image-label">
                ZOREVA
              </span>

              <img
                src="${product.image}"
                alt="${product.name}"
              >

            </div>

          </div>


          <!-- INFORMATION -->

          <div class="product-info">


            <div class="product-category">
              ${product.category}
            </div>


            <h1>
              ${product.name}
            </h1>


            <div class="product-price">
              ${product.price} DH
            </div>


            <div class="product-divider"></div>


            <p class="product-description">
              ${product.description}
            </p>


            <!-- DETAILS -->

            <div class="product-details">

              <div class="detail-row">

                <span>
                  Catégorie
                </span>

                <strong>
                  ${product.category}
                </strong>

              </div>


              <div class="detail-row">

                <span>
                  Disponibilité
                </span>

                <strong>
                  Disponible
                </strong>

              </div>


              <div class="detail-row">

                <span>
                  Commande
                </span>

                <strong>
                  Via WhatsApp
                </strong>

              </div>

            </div>


            <!-- QUANTITY -->

            <div class="quantity-area">

              <span class="quantity-label">
                Quantité
              </span>


              <div class="quantity-control">

                <button
                  type="button"
                  onclick="changeQuantity(-1)"
                  aria-label="Diminuer la quantité"
                >
                  −
                </button>


                <span id="quantity">
                  1
                </span>


                <button
                  type="button"
                  onclick="changeQuantity(1)"
                  aria-label="Augmenter la quantité"
                >
                  +
                </button>

              </div>

            </div>


            <!-- ACTIONS -->

            <div class="product-actions">


              <button
                type="button"
                class="add-product-btn"
                onclick="handleAddToCart()"
              >
                Ajouter au panier
              </button>


              <a
                href="#"
                class="whatsapp-product-btn"
                onclick="handleWhatsApp(event)"
              >
                Commander sur WhatsApp
              </a>


            </div>


            <!-- TRUST -->

            <div class="product-trust">

              <div>

                <span>
                  01
                </span>

                <p>
                  Commande simple
                </p>

              </div>


              <div>

                <span>
                  02
                </span>

                <p>
                  Réponse directe
                </p>

              </div>


              <div>

                <span>
                  03
                </span>

                <p>
                  ZOREVA Jewelry
                </p>

              </div>

            </div>

          </div>

        </div>


        <!-- RELATED -->

        <section class="related-products">

          <div class="related-header">

            <span>
              ZOREVA JEWELRY
            </span>

            <h2>
              Vous pourriez aussi aimer
            </h2>

          </div>


          <div
            class="related-grid"
            id="relatedProducts"
          ></div>

        </section>

      `;


      renderRelatedProducts();

    }


    /* =========================================
       QUANTITY
    ========================================= */

    function changeQuantity(
      change
    ) {

      quantity += change;


      if (quantity < 1) {
        quantity = 1;
      }


      if (quantity > 20) {
        quantity = 20;
      }


      const element =
        document.getElementById(
          "quantity"
        );


      if (element) {

        element.textContent =
          quantity;

      }

    }


    /* =========================================
       HANDLE CART
    ========================================= */

    function handleAddToCart() {

      if (!product) return;


      addToCart(
        productId,
        quantity
      );

    }


    /* =========================================
       HANDLE WHATSAPP
    ========================================= */

    function handleWhatsApp(
      event
    ) {

      event.preventDefault();


      if (!product) return;


      buyOnWhatsApp(
        productId,
        quantity
      );

    }


    /* =========================================
       RELATED PRODUCTS
    ========================================= */

    function renderRelatedProducts() {

      const container =
        document.getElementById(
          "relatedProducts"
        );


      if (!container) return;


      const related =
        Object.entries(products)
          .filter(
            ([id]) =>
              id !== productId
          )
          .slice(0, 3);


      container.innerHTML =
        related.map(
          ([id, item]) => `

            <a
              href="product.html?product=${id}"
              class="related-card"
            >

              <div class="related-image">

                <img
                  src="${item.image}"
                  alt="${item.name}"
                  loading="lazy"
                >

                <span class="related-view">
                  Voir le produit
                </span>

              </div>


              <div class="related-info">

                <span>
                  ${item.category}
                </span>

                <h3>
                  ${item.name}
                </h3>

                <p>
                  ${item.price} DH
                </p>

              </div>

            </a>

          `
        ).join("");

    }


    /* =========================================
       START
    ========================================= */

    updateCartCount();

    renderProduct();

  </script>

</body>
</html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="ZOREVA Jewelry — Bijoux élégants et modernes.">

<title>ZOREVA — Produit</title>

<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="shortcut icon" href="logo.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

:root{
--black:#111;
--gold:#b9975b;
--gold-dark:#92733c;
--cream:#f8f6f1;
--white:#fff;
--border:#e7e1d7;
--muted:#777;
--red:#b42318;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
background:#fff;
color:var(--black);
font-family:'Montserrat',sans-serif;
overflow-x:hidden;
}

a{
color:inherit;
text-decoration:none;
}

button,
input{
font-family:inherit;
}

button{
cursor:pointer;
}

img{
display:block;
max-width:100%;
}


/* =====================================
   PROMOTION BAR
===================================== */

.promo-bar{
height:38px;
background:#111;
color:#fff;
display:flex;
align-items:center;
justify-content:center;
font-size:9px;
font-weight:500;
letter-spacing:1.8px;
text-transform:uppercase;
text-align:center;
padding:0 12px;
}


/* =====================================
   HEADER
===================================== */

header{
height:82px;
background:rgba(255,255,255,.97);
backdrop-filter:blur(15px);
border-bottom:1px solid #eee;
position:sticky;
top:0;
z-index:1000;
}

.header-inner{
height:100%;
max-width:1450px;
margin:auto;
padding:0 35px;
display:grid;
grid-template-columns:1fr auto 1fr;
align-items:center;
}

.back-home{
display:flex;
align-items:center;
gap:9px;
font-size:9px;
letter-spacing:1.8px;
text-transform:uppercase;
color:#777;
width:max-content;
transition:.3s;
}

.back-home:hover{
color:var(--gold-dark);
}

.back-home span{
font-size:19px;
}

.brand{
display:flex;
align-items:center;
justify-content:center;
gap:9px;
}

.brand img{
width:52px;
height:52px;
object-fit:contain;
}

.brand-name{
font-family:'Cormorant Garamond',serif;
font-size:27px;
font-weight:600;
letter-spacing:4px;
}

.header-actions{
display:flex;
justify-content:flex-end;
}

.cart-btn{
width:48px;
height:48px;
border:0;
background:none;
position:relative;
display:flex;
align-items:center;
justify-content:center;
}

.cart-svg{
width:24px;
height:24px;
fill:none;
stroke:#111;
stroke-width:1.5;
}

.cart-count{
position:absolute;
top:1px;
right:0;
width:18px;
height:18px;
border-radius:50%;
background:var(--gold);
color:#fff;
display:flex;
align-items:center;
justify-content:center;
font-size:9px;
font-weight:600;
}


/* =====================================
   PRODUCT
===================================== */

.product-page{
max-width:1450px;
margin:auto;
padding:35px 35px 100px;
}

.breadcrumb{
display:flex;
align-items:center;
gap:9px;
font-size:8px;
letter-spacing:1.6px;
text-transform:uppercase;
color:#999;
margin-bottom:28px;
}

.breadcrumb a:hover{
color:var(--gold-dark);
}

.product-layout{
display:grid;
grid-template-columns:minmax(0,1.05fr) minmax(390px,.95fr);
gap:70px;
align-items:start;
}


/* =====================================
   IMAGE
===================================== */

.product-gallery{
position:relative;
background:#f6f4ef;
overflow:hidden;
}

.product-gallery img{
width:100%;
aspect-ratio:1/1.08;
object-fit:cover;
transition:transform 1s cubic-bezier(.2,.7,.2,1);
}

.product-gallery:hover img{
transform:scale(1.025);
}

.gallery-label{
position:absolute;
left:18px;
top:18px;
z-index:2;
background:#111;
color:#fff;
padding:9px 14px;
font-size:8px;
letter-spacing:2px;
text-transform:uppercase;
}

.image-counter{
position:absolute;
right:18px;
bottom:18px;
background:rgba(255,255,255,.92);
padding:8px 12px;
font-size:8px;
color:#555;
}


/* =====================================
   DETAILS
===================================== */

.product-details{
padding:18px 10px 0 0;
}

.product-category{
font-size:9px;
color:var(--gold-dark);
letter-spacing:3px;
text-transform:uppercase;
margin-bottom:13px;
}

.product-title{
font-family:'Cormorant Garamond',serif;
font-size:62px;
line-height:.95;
font-weight:500;
margin-bottom:14px;
}

.price-area{
margin-bottom:15px;
}

.current-price{
font-size:21px;
font-weight:600;
letter-spacing:.5px;
display:inline-block;
margin-right:8px;
}

.old-price{
font-size:13px;
color:#999;
text-decoration:line-through;
display:inline-block;
}

.sale-badge{
display:inline-flex;
align-items:center;
justify-content:center;
margin-top:9px;
background:#111;
color:#fff;
padding:7px 10px;
font-size:8px;
font-weight:600;
letter-spacing:1.3px;
text-transform:uppercase;
}

.sale-badge span{
color:#d9b76e;
margin-right:5px;
}

.stock{
font-size:9px;
color:#3c7a4b;
letter-spacing:1px;
margin:13px 0 22px;
}

.gold-line{
width:60px;
height:1px;
background:var(--gold);
margin-bottom:25px;
}


/* =====================================
   BENEFITS
===================================== */

.product-benefits{
display:flex;
flex-direction:column;
gap:11px;
margin-bottom:28px;
}

.benefit{
font-size:11px;
line-height:1.6;
color:#333;
}


/* =====================================
   QUANTITY
===================================== */

.quantity-title{
font-size:9px;
letter-spacing:1.5px;
text-transform:uppercase;
margin-bottom:9px;
}

.quantity-box{
width:125px;
height:48px;
border:1px solid var(--border);
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:17px;
}

.quantity-box button{
width:40px;
height:100%;
border:0;
background:#fff;
font-size:19px;
color:#555;
}

.quantity-box span{
font-size:11px;
font-weight:600;
}


/* =====================================
   ACTIONS
===================================== */

.product-actions{
display:flex;
flex-direction:column;
gap:9px;
max-width:520px;
}

.add-cart{
width:100%;
height:54px;
border:1px solid #111;
background:#111;
color:#fff;
font-size:9px;
letter-spacing:2px;
text-transform:uppercase;
transition:.3s;
}

.add-cart:hover{
background:var(--gold-dark);
border-color:var(--gold-dark);
}

.whatsapp-order{
width:100%;
height:54px;
border:1px solid #111;
background:#fff;
color:#111;
font-size:9px;
letter-spacing:2px;
text-transform:uppercase;
transition:.3s;
}

.whatsapp-order:hover{
background:#111;
color:#fff;
}


/* =====================================
   SHIPPING INFO
===================================== */

.shipping-box{
margin-top:23px;
border-top:1px solid var(--border);
border-bottom:1px solid var(--border);
}

.shipping-row{
min-height:48px;
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:1px solid var(--border);
font-size:9px;
}

.shipping-row:last-child{
border-bottom:0;
}

.shipping-label{
color:#999;
letter-spacing:1.1px;
text-transform:uppercase;
}

.shipping-value{
font-weight:500;
}


/* =====================================
   STORY
===================================== */

.product-story{
border-top:1px solid var(--border);
max-width:1450px;
margin:auto;
padding:75px 35px;
}

.story-inner{
max-width:850px;
}

.story-small{
font-size:9px;
letter-spacing:3px;
text-transform:uppercase;
color:var(--gold-dark);
margin-bottom:12px;
}

.story-title{
font-family:'Cormorant Garamond',serif;
font-size:47px;
font-weight:500;
margin-bottom:20px;
}

.story-text{
font-size:11px;
line-height:2.1;
color:#777;
max-width:750px;
}


/* =====================================
   RELATED
===================================== */

.related-section{
max-width:1450px;
margin:auto;
padding:0 35px 100px;
}

.related-heading{
margin-bottom:28px;
}

.related-small{
font-size:9px;
letter-spacing:3px;
text-transform:uppercase;
color:var(--gold-dark);
margin-bottom:9px;
}

.related-title{
font-family:'Cormorant Garamond',serif;
font-size:42px;
font-weight:500;
}

.related-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:18px;
}

.related-card{
cursor:pointer;
}

.related-image{
background:#f5f3ee;
overflow:hidden;
position:relative;
}

.related-image img{
width:100%;
aspect-ratio:1/1.08;
object-fit:cover;
transition:transform .7s ease;
}

.related-card:hover .related-image img{
transform:scale(1.035);
}

.related-info{
padding:12px 2px 0;
}

.related-name{
font-family:'Cormorant Garamond',serif;
font-size:20px;
margin-bottom:5px;
}

.related-price{
font-size:10px;
color:#777;
}


/* =====================================
   CART
===================================== */

.cart-overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
z-index:3000;
opacity:0;
visibility:hidden;
transition:.3s;
}

.cart-overlay.active{
opacity:1;
visibility:visible;
}

.cart-panel{
position:fixed;
top:0;
right:-450px;
width:420px;
max-width:94%;
height:100vh;
background:#fff;
z-index:3100;
transition:.45s ease;
display:flex;
flex-direction:column;
box-shadow:-15px 0 45px rgba(0,0,0,.15);
}

.cart-panel.active{
right:0;
}

.cart-header{
padding:24px;
border-bottom:1px solid var(--border);
display:flex;
justify-content:space-between;
align-items:center;
}

.cart-header h2{
font-family:'Cormorant Garamond',serif;
font-size:30px;
font-weight:500;
}

.cart-close{
width:36px;
height:36px;
border:1px solid var(--border);
border-radius:50%;
background:#fff;
font-size:20px;
}

.cart-items{
flex:1;
overflow-y:auto;
padding:8px 22px;
}

.cart-empty{
text-align:center;
color:#888;
font-size:12px;
padding:70px 20px;
}

.cart-item{
display:grid;
grid-template-columns:72px 1fr 30px;
gap:13px;
padding:17px 0;
border-bottom:1px solid var(--border);
align-items:center;
}

.cart-item img{
width:72px;
height:72px;
object-fit:cover;
background:#f7f5f0;
}

.cart-item h4{
font-family:'Cormorant Garamond',serif;
font-size:19px;
font-weight:500;
margin-bottom:5px;
}

.cart-item p{
font-size:10px;
color:#777;
}

.remove-item{
width:28px;
height:28px;
border:0;
border-radius:50%;
background:#f5f3ef;
font-size:16px;
color:#777;
}

.cart-footer{
padding:20px 22px 24px;
border-top:1px solid var(--border);
}

.cart-total{
display:flex;
justify-content:space-between;
margin-bottom:17px;
font-size:13px;
}

.checkout-btn{
width:100%;
height:52px;
border:0;
background:#111;
color:#fff;
font-size:10px;
letter-spacing:2px;
text-transform:uppercase;
}

.checkout-btn:hover{
background:var(--gold-dark);
}


/* =====================================
   WHATSAPP
===================================== */

.whatsapp-float{
position:fixed;
right:24px;
bottom:24px;
width:58px;
height:58px;
border-radius:50%;
background:#25D366;
display:flex;
align-items:center;
justify-content:center;
z-index:2500;
box-shadow:0 8px 25px rgba(0,0,0,.18);
transition:.3s;
}

.whatsapp-float:hover{
transform:translateY(-4px) scale(1.04);
}

.whatsapp-float svg{
width:31px;
height:31px;
fill:#fff;
}


/* =====================================
   FOOTER
===================================== */

footer{
background:#111;
color:#fff;
padding:60px 30px 30px;
}

.footer-inner{
max-width:1450px;
margin:auto;
}

.footer-logo{
display:flex;
align-items:center;
justify-content:center;
gap:10px;
margin-bottom:17px;
}

.footer-logo img{
width:55px;
height:55px;
object-fit:contain;
}

.footer-logo span{
font-family:'Cormorant Garamond',serif;
font-size:28px;
letter-spacing:4px;
}

.footer-text{
text-align:center;
color:#888;
font-size:9px;
letter-spacing:1px;
}

.footer-links{
display:flex;
justify-content:center;
gap:25px;
margin-top:25px;
flex-wrap:wrap;
}

.footer-links a{
font-size:8px;
letter-spacing:1.3px;
color:#999;
text-transform:uppercase;
transition:.3s;
}

.footer-links a:hover{
color:#fff;
}

.copyright{
text-align:center;
color:#666;
font-size:8px;
letter-spacing:1px;
margin-top:35px;
padding-top:25px;
border-top:1px solid rgba(255,255,255,.1);
}


/* =====================================
   MOBILE
===================================== */

@media(max-width:1000px){

.product-layout{
grid-template-columns:1fr;
gap:38px;
}

.product-details{
padding:0;
}

font-size:55px;
}

.related-grid{
grid-template-columns:repeat(2,1fr);
}

}


@media(max-width:600px){

.promo-bar{
height:34px;
font-size:7px;

}

header{
height:70px;
}

padding:0 14px;
}

.brand img{
width:43px;

}

.brand-name{
font-size:19px;

}

.back-home{
font-size:7px;

}

.back-home span{
font-size:15px;
}

.cart-btn{
width:40px;
height:40px;
}

.product-page{
padding:22px 14px 65px;
}

.breadcrumb{

.product-layout{

}

.gallery-label{

}

.product-benefits{

}

.quantity-box{
height:46px;
}

.add-cart,
.whatsapp-order{
height:52px;
}

.product-story{
padding:58px 14px;
}

.story-text{

}

.related-section{
padding:0 14px 65px;
}

.related-title{
font-size:36px;
}

.related-grid{

gap:14px;
}

.related-name{
font-size:18px;
}

.related-price{
font-size:9px;
}

.whatsapp-float{
width:54px;
height:54px;
right:14px;
bottom:14px;
}

.cart-panel{
width:100%;
max-width:100%;
}

.footer-links{
gap:15px;
}

}


@media(max-width:380px){

.product-title{
font-size:39px;
}

.brand-name{
font-size:17px;
}

.product-page{
padding-left:11px;
padding-right:11px;
}

.related-section{
padding-left:11px;
padding-right:11px;
}

}

</style>

</head>

let currentQuantity = 1;


function changeQuantity(amount){

currentQuantity += amount;


if(currentQuantity < 1){
currentQuantity = 1;
}


if(currentQuantity > 10){
currentQuantity = 10;
}


const quantityElement =
document.getElementById("quantityValue");


if(quantityElement){
quantityElement.textContent =
currentQuantity;
}

}


/* =========================================
   CART
========================================= */

let cart =
JSON.parse(localStorage.getItem("zorevaCart")) || [];


function saveCart(){

localStorage.setItem(
"zorevaCart",
JSON.stringify(cart)
);

}


function updateCartCount(){

const count =
cart.reduce(
(total,item)=>total + item.quantity,
0
);


document.getElementById("cartCount")
.textContent = count;

}


function addToCart(product, quantity = 1){

const existing =
cart.find(
item => item.id === product.id
);


if(existing){

existing.quantity += quantity;

}else{

cart.push({

id:product.id,

name:product.name,

price:product.price,

image:product.image,

quantity:quantity

});

}


saveCart();

updateCartCount();

renderCart();

openCart();

}


function addCurrentProduct(){

if(!product){
return;
}


addToCart(
product,
currentQuantity
);


const button =
document.querySelector(".add-cart");


if(button){

button.textContent =
"Ajouté au panier ✓";


setTimeout(()=>{

button.textContent =
"Ajouter au panier";

},1500);

}

}


/* =========================================
   REMOVE CART
========================================= */

function removeFromCart(id){

cart =
cart.filter(
item => item.id !== id
);


saveCart();

updateCartCount();

renderCart();

}


/* =========================================
   RENDER CART
========================================= */

function renderCart(){

const container =
document.getElementById("cartItems");


if(cart.length === 0){

container.innerHTML = `

<div class="cart-empty">
Votre panier est vide.
</div>

`;


document.getElementById("cartTotal")
.textContent = "0 DH";


return;

}


container.innerHTML = "";

let total = 0;


cart.forEach(item => {

const subtotal =
item.price * item.quantity;


total += subtotal;


const div =
document.createElement("div");


div.className =
"cart-item";


div.innerHTML = `

<img
src="${item.image}"
alt="${item.name}"
>

<div>

<h4>
${item.name}
</h4>

<p>
${item.quantity} × ${item.price} DH
</p>

</div>

<button
class="remove-item"
onclick="removeFromCart(${item.id})"
>
×
</button>

`;


container.appendChild(div);

});


document.getElementById("cartTotal")
.textContent =
`${total} DH`;

}

/* =========================================
   CART OPEN
========================================= */

const cartPanel =
document.getElementById("cartPanel");


const cartOverlay =
document.getElementById("cartOverlay");


function openCart(){

cartPanel.classList.add("active");

cartOverlay.classList.add("active");

}


function closeCart(){

cartPanel.classList.remove("active");

cartOverlay.classList.remove("active");

}


document
.getElementById("cartBtn")
.addEventListener(
"click",
openCart
);


document
.getElementById("cartClose")
.addEventListener(
"click",
closeCart
);


cartOverlay.addEventListener(
"click",
closeCart
);


/* =========================================
   CHECKOUT
========================================= */

document
.getElementById("checkoutBtn")
.addEventListener(
"click",
()=>{


if(cart.length === 0){

alert(
"Votre panier est vide."
);

return;

}


let message =
"Bonjour ZOREVA, je souhaite passer une commande :\n\n";


let total = 0;


cart.forEach(item => {

const subtotal =
item.price * item.quantity;


total += subtotal;


message +=
`${item.name} — ${item.quantity} × ${item.price} DH = ${subtotal} DH\n`;

});


message +=
`\nTotal : ${total} DH`;


window.open(

"https://wa.me/212765333754?text=" +
encodeURIComponent(message),

"_blank"

);

});

<!DOCTYPE html>
<html lang="fr">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Produit | ZOREVA JEWELRY</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: #fff;
      color: #111;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    header {
      height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6%;
      border-bottom: 1px solid #eee;
      background: rgba(255,255,255,.96);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      width: 52px;
      height: 52px;
    }

    .back {
      font-size: 11px;
      letter-spacing: 2px;
      transition: .3s;
    }

    .back:hover {
      color: #b8944e;
    }

    .cart-link {
      border: 1px solid #b8944e;
      padding: 10px 16px;
      font-size: 11px;
      cursor: pointer;
    }

    .product-page {
      min-height: calc(100vh - 78px);
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      align-items: center;
      gap: 70px;
      padding: 70px 8%;
      max-width: 1450px;
      margin: auto;
    }

    .product-photo {
      min-height: 650px;
      background: #fff;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      animation: fadeIn 1s ease;
    }

    .product-photo::before {
      content: "";
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: #f5f0e7;
      position: absolute;
      animation: circleIn 1.2s ease;
    }

    .product-photo img {
      width: 100%;
      height: 650px;
      object-fit: contain;
      position: relative;
      z-index: 2;
      padding: 30px;
      animation: productIn 1s ease;
    }

    .product-details {
      animation: detailsIn 1s ease .2s both;
    }

    .small-title {
      color: #b8944e;
      letter-spacing: 4px;
      font-size: 11px;
      text-transform: uppercase;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(55px,6vw,85px);
      font-weight: 500;
      line-height: .95;
      margin: 18px 0;
    }

    .gold-line {
      width: 65px;
      height: 1px;
      background: #b8944e;
      margin: 25px 0;
    }

    .price {
      color: #b8944e;
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 25px;
    }

    .description {
      color: #666;
      font-size: 13px;
      line-height: 2;
      max-width: 470px;
      margin-bottom: 30px;
    }

    .order {
      display: inline-block;
      padding: 16px 35px;
      background: #111;
      color: #fff;
      border: 1px solid #111;
      font-size: 11px;
      letter-spacing: 2px;
      transition: .35s;
      cursor: pointer;
    }

    .order:hover {
      background: #b8944e;
      border-color: #b8944e;
      transform: translateY(-3px);
    }

    .add {
      display: inline-block;
      margin-left: 10px;
      padding: 16px 25px;
      background: #fff;
      color: #111;
      border: 1px solid #b8944e;
      font-size: 11px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: .35s;
    }

    .add:hover {
      background: #b8944e;
      color: #fff;
    }

    footer {
      background: #0b0b0b;
      color: #aaa;
      text-align: center;
      padding: 30px;
      font-size: 10px;
      letter-spacing: 1px;
    }

    footer strong {
      color: #d1b06a;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes circleIn {
      from {
        transform: scale(.6);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes productIn {
      from {
        opacity: 0;
        transform: scale(.88);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes detailsIn {
      from {
        opacity: 0;
        transform: translateX(40px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @media(max-width:800px) {

      .product-page {
        grid-template-columns: 1fr;
        padding: 40px 20px 70px;
        gap: 20px;
      }

      .product-photo {
        min-height: 430px;
      }

      .product-photo img {
        height: 430px;
      }

      .product-photo::before {
        width: 330px;
        height: 330px;
      }

      h1 {
        font-size: 55px;
      }

      .add {
        margin-left: 0;
        margin-top: 10px;
      }

    }

  </style>

</head>

<body>

<header>

  <a href="index.html">
    <img
      src="logo.svg"
      class="logo"
      alt="ZOREVA JEWELRY"
    >
  </a>

  <a
    href="index.html"
    class="back"
  >
    ← RETOUR AUX PRODUITS
  </a>

  <a
    href="index.html#products"
    class="cart-link"
  >
    PRODUITS
  </a>

</header>


<main class="product-page">

  <div class="product-photo">

    <img
      id="productImage"
      src=""
      alt=""
    >

  </div>


  <div class="product-details">

    <div class="small-title">
      ZOREVA JEWELRY
    </div>

    <h1 id="productName">
      Produit
    </h1>

    <div class="gold-line"></div>

    <div
      class="price"
      id="productPrice"
    >
      0 DH
    </div>

    <p class="description">
      Une pièce élégante sélectionnée par ZOREVA JEWELRY.
      Un design raffiné pensé pour apporter une touche
      distinctive à votre style.
    </p>

    <button
      class="order"
      onclick="orderProduct()"
    >
      COMMANDER SUR WHATSAPP
    </button>

    <button
      class="add"
      onclick="addProductToCart()"
    >
      AJOUTER AU PANIER
    </button>

  </div>

</main>


<footer>

  © 2026 <strong>ZOREVA JEWELRY</strong> —
  Tous droits réservés.

</footer>


<script>

  const products = {

    "collier-eclat": {
      name: "Collier Éclat",
      price: 119,
      image: "IMG_20260726_171518.jpg"
    },

    "bague-elegance": {
      name: "Bague Élégance",
      price: 119,
      image: "IMG_20260726_171656.jpg"
    },

    "bracelet-luna": {
      name: "Bracelet Luna",
      price: 149,
      image: "IMG_20260726_171921.jpg"
    },

    "bague-signature": {
      name: "Bague Signature",
      price: 149,
      image: "IMG_20260726_175331.jpg"
    },

    "collier-perla": {
      name: "Collier Perla",
      price: 149,
      image: "IMG_20260726_180004.jpg"
    },

    "bracelet-elegance": {
      name: "Bracelet Élégance",
      price: 149,
      image: "IMG_20260726_180304.jpg"
    },

    "bague-royale": {
      name: "Bague Royale",
      price: 149,
      image: "IMG_20260726_180430.jpg"
    }

  };


  const params =
    new URLSearchParams(window.location.search);

  const id =
    params.get("id");

  const product =
    products[id];


  if (!product) {

    document.getElementById("productName").textContent =
      "Produit introuvable";

    document.getElementById("productPrice").textContent =
      "";

    document.getElementById("productImage").style.display =
      "none";

  } else {

    document.getElementById("productName").textContent =
      product.name;

    document.getElementById("productPrice").textContent =
      product.price + " DH";

    document.getElementById("productImage").src =
      "https://raw.githubusercontent.com/abdorrahman3yw-rgb/zoreva-jewelry/main/" +
      product.image;

    document.getElementById("productImage").alt =
      product.name;

    document.title =
      product.name + " | ZOREVA JEWELRY";

  }


  function orderProduct() {

    if (!product) return;

    const message =
      "Bonjour ZOREVA JEWELRY, je souhaite commander : " +
      product.name +
      " — " +
      product.price +
      " DH";

    window.open(
      "https://wa.me/212765333754?text=" +
      encodeURIComponent(message),
      "_blank"
    );

  }


  function addProductToCart() {

    if (!product) return;

    let cart =
      JSON.parse(
        localStorage.getItem("zorevaCart") || "[]"
      );

    const existing =
      cart.find(
        item => item.name === product.name
      );

    if (existing) {

      existing.quantity++;

    } else {

      cart.push({
        name: product.name,
        price: product.price,
        image: product.image,
        quantity: 1
      });

    }

    localStorage.setItem(
      "zorevaCart",
      JSON.stringify(cart)
    );

    alert(
      product.name +
      " a été ajouté au panier."
    );

  }

</script>

</body>
</html>

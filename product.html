<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Découvrez les bijoux ZOREVA Jewelry et commandez directement sur WhatsApp."
  >

  <title>Produit — ZOREVA Jewelry</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="header-inner">

      <a href="index.html" class="logo">
        <strong>ZOREVA</strong>
        <span>JEWELRY</span>
      </a>

      <nav class="main-nav">
        <a href="index.html">Accueil</a>
        <a href="index.html#collections">Collections</a>
        <a href="index.html#products">Bijoux</a>
        <a href="index.html#about">À propos</a>
        <a href="index.html#contact">Contact</a>
      </nav>

      <button
        class="cart-btn"
        type="button"
        onclick="goToCart()"
      >
        Panier
        <span id="cartCount">0</span>
      </button>

    </div>
  </header>


  <!-- PRODUCT PAGE -->
  <main class="product-page">

    <div class="product-container">

      <a
        href="index.html#products"
        class="back-link"
      >
        ← Retour aux bijoux
      </a>

      <div id="productContent"></div>

    </div>

  </main>


  <!-- FOOTER -->
  <footer class="site-footer">

    <div class="footer-inner">

      <div class="footer-brand">

        <a href="index.html" class="logo">
          <strong>ZOREVA</strong>
          <span>JEWELRY</span>
        </a>

        <p>
          L'élégance, simplement.
        </p>

      </div>


      <div class="footer-column">

        <h4>Navigation</h4>

        <a href="index.html">Accueil</a>
        <a href="index.html#collections">Collections</a>
        <a href="index.html#products">Bijoux</a>
        <a href="index.html#about">À propos</a>

      </div>


      <div class="footer-column">

        <h4>Collections</h4>

        <a href="index.html#products">
          Bagues
        </a>

        <a href="index.html#products">
          Bracelets
        </a>

        <a href="index.html#products">
          Colliers
        </a>

      </div>


      <div class="footer-column">

        <h4>Contact</h4>

        <a
          href="https://wa.me/212765333754"
          target="_blank"
          rel="noopener"
        >
          WhatsApp
        </a>

        <a href="index.html#contact">
          Nous contacter
        </a>

      </div>

    </div>


    <div class="footer-bottom">
      © 2026 ZOREVA Jewelry — Tous droits réservés.
    </div>

  </footer>


  <!-- JAVASCRIPT -->
  <script>

    /* =========================
       PRODUCTS
    ========================= */

    const products = {

      "collier-eclat": {
        name: "Collier Éclat",
        price: 119,
        category: "Collier",
        image: "https://raw.githubusercontent.com/abdorrahman3yw-rgb/zoreva-jewelry/main/IMG_20260726_171518.jpg",
        description:
          "Un collier élégant au design raffiné, pensé pour apporter une touche lumineuse et sophistiquée à votre style."
      },

      "bague-elegance": {
        name: "Bague Élégance",
        price: 119,
        category: "Bague",
        image: "https://raw.githubusercontent.com/abdorrahman3yw-rgb/zoreva-jewelry/main/IMG_20260726_171656.jpg",
        description:
          "Une bague délicate et élégante, idéale pour compléter votre look avec une touche chic et intemporelle."
      },

      "bracelet-luna": {
        name: "Bracelet Luna",
        price: 149,
        category: "Bracelet",
        image: "https://raw.githubusercontent.com/abdorrahman3yw-rgb/zoreva-jewelry/main/IMG_20260726_171921.jpg",
        description:
          "Un bracelet raffiné au style moderne, parfait pour accompagner vos tenues au quotidien."
      },

      "bague-signature": {
        name: "Bague Signature",
        price: 149,
        category: "Bague",
        image: "https://raw.githubusercontent.com/abdorrahman3yw-rgb/zoreva-jewelry/main/IMG_20260726_175331.jpg",
        description:
          "Une pièce élégante avec une présence unique, conçue pour celles et ceux qui apprécient les détails raffinés."
      },

      "collier-perla": {
        name: "Collier Perla",
        price: 149,
        category: "Collier",
        image: "https://raw.githubusercontent.com/abdorrahman3yw-rgb/zoreva-jewelry/main/IMG_20260726_180004.jpg",
        description:
          "Un collier chic et délicat qui apporte une finition élégante à votre tenue."
      },

      "bracelet-elegance": {
        name: "Bracelet Élégance",
        price: 149,
        category: "Bracelet",
        image: "https://raw.githubusercontent.com/abdorrahman3yw-rgb/zoreva-jewelry/main/IMG_20260726_180304.jpg",
        description:
          "Un bracelet sophistiqué au style épuré, facile à porter seul ou avec d'autres bijoux."
      },

      "bague-royale": {
        name: "Bague Royale",
        price: 149,
        category: "Bague",
        image: "https://raw.githubusercontent.com/abdorrahman3yw-rgb/zoreva-jewelry/main/IMG_20260726_180430.jpg",
        description:
          "Une bague au caractère élégant et distingué, idéale pour ajouter une touche premium à votre style."
      }

    };


    /* =========================
       URL PRODUCT
    ========================= */

    const params =
      new URLSearchParams(
        window.location.search
      );

    const productId =
      params.get("product");

    const product =
      products[productId];


    /* =========================
       CART
    ========================= */

    let cart =
      JSON.parse(
        localStorage.getItem("zorevaCart")
      ) || [];


    function saveCart() {

      localStorage.setItem(
        "zorevaCart",
        JSON.stringify(cart)
      );

    }


    function updateCartCount() {

      const countElement =
        document.getElementById("cartCount");

      if (!countElement) return;

      const total =
        cart.reduce(
          (sum, item) =>
            sum + item.quantity,
          0
        );

      countElement.textContent =
        total;

    }


    /* =========================
       ADD TO CART
    ========================= */

    function addToCart(
      productId,
      quantity = 1
    ) {

      const selectedProduct =
        products[productId];

      if (!selectedProduct) return;


      const existing =
        cart.find(
          item =>
            item.id === productId
        );


      if (existing) {

        existing.quantity += quantity;

      } else {

        cart.push({

          id: productId,

          name: selectedProduct.name,

          price: selectedProduct.price,

          image: selectedProduct.image,

          quantity: quantity

        });

      }


      saveCart();

      updateCartCount();

      showCartMessage();

    }


    /* =========================
       CART MESSAGE
    ========================= */

    function showCartMessage() {

      const button =
        document.querySelector(
          ".add-product-btn"
        );

      if (!button) return;


      const originalText =
        button.textContent;


      button.textContent =
        "Ajouté au panier ✓";


      button.classList.add(
        "added"
      );


      setTimeout(() => {

        button.textContent =
          originalText;

        button.classList.remove(
          "added"
        );

      }, 1800);

    }


    /* =========================
       WHATSAPP
    ========================= */

    function buyOnWhatsApp(
      productId,
      quantity
    ) {

      const selectedProduct =
        products[productId];

      if (!selectedProduct) return;


      const total =
        selectedProduct.price *
        quantity;


      const message =
        `Bonjour ZOREVA Jewelry,%0A%0A` +
        `Je souhaite commander :%0A%0A` +
        `Produit : ${selectedProduct.name}%0A` +
        `Quantité : ${quantity}%0A` +
        `Prix total : ${total} DH%0A%0A` +
        `Merci.`;


      window.open(
        `https://wa.me/212765333754?text=${message}`,
        "_blank"
      );

    }


    /* =========================
       GO TO CART
    ========================= */

    function goToCart() {

      window.location.href =
        "index.html#cart";

    }


    /* =========================
       RENDER PRODUCT
    ========================= */

    let quantity = 1;


    function renderProduct() {

      const container =
        document.getElementById(
          "productContent"
        );


      if (!product) {

        container.innerHTML = `

          <div class="product-not-found">

            <span class="product-not-found-label">
              ZOREVA JEWELRY
            </span>

            <h1>
              Produit introuvable
            </h1>

            <p>
              Ce produit n'existe pas
              ou le lien est incorrect.
            </p>

            <a href="index.html#products">
              Retour aux bijoux
            </a>

          </div>

        `;

        return;

      }


      document.title =
        `${product.name} — ZOREVA Jewelry`;


      container.innerHTML = `

        <div class="product-main">


          <!-- IMAGE -->

          <div class="product-image-side">

            <div class="product-image-box">

              <span class="product-image-label">
                ZOREVA
              </span>

              <img
                src="${product.image}"
                alt="${product.name}"
              >

            </div>

          </div>


          <!-- INFORMATION -->

          <div class="product-info">


            <div class="product-category">
              ${product.category}
            </div>


            <h1>
              ${product.name}
            </h1>


            <div class="product-price">
              ${product.price} DH
            </div>


            <div class="product-divider"></div>


            <p class="product-description">
              ${product.description}
            </p>


            <!-- DETAILS -->

            <div class="product-details">

              <div class="detail-row">

                <span>
                  Catégorie
                </span>

                <strong>
                  ${product.category}
                </strong>

              </div>


              <div class="detail-row">

                <span>
                  Disponibilité
                </span>

                <strong>
                  Disponible
                </strong>

              </div>


              <div class="detail-row">

                <span>
                  Commande
                </span>

                <strong>
                  Via WhatsApp
                </strong>

              </div>

            </div>


            <!-- QUANTITY -->

            <div class="quantity-area">

              <span class="quantity-label">
                Quantité
              </span>


              <div class="quantity-control">

                <button
                  type="button"
                  onclick="changeQuantity(-1)"
                  aria-label="Diminuer la quantité"
                >
                  −
                </button>


                <span id="quantity">
                  1
                </span>


                <button
                  type="button"
                  onclick="changeQuantity(1)"
                  aria-label="Augmenter la quantité"
                >
                  +
                </button>

              </div>

            </div>


            <!-- ACTIONS -->

            <div class="product-actions">


              <button
                type="button"
                class="add-product-btn"
                onclick="handleAddToCart()"
              >
                Ajouter au panier
              </button>


              <a
                href="#"
                class="whatsapp-product-btn"
                onclick="handleWhatsApp(event)"
              >
                Commander sur WhatsApp
              </a>


            </div>


            <!-- TRUST -->

            <div class="product-trust">

              <div>
                <span>01</span>
                <p>
                  Commande simple
                </p>
              </div>

              <div>
                <span>02</span>
                <p>
                  Réponse directe
                </p>
              </div>

              <div>
                <span>03</span>
                <p>
                  ZOREVA Jewelry
                </p>
              </div>

            </div>

          </div>

        </div>


        <!-- RELATED -->

        <section class="related-products">

          <div class="related-header">

            <span>
              ZOREVA JEWELRY
            </span>

            <h2>
              Vous pourriez aussi aimer
            </h2>

          </div>


          <div
            class="related-grid"
            id="relatedProducts"
          ></div>

        </section>

      `;


      renderRelatedProducts();

    }


    /* =========================
       QUANTITY
    ========================= */

    function changeQuantity(
      change
    ) {

      quantity += change;


      if (quantity < 1) {
        quantity = 1;
      }


      if (quantity > 20) {
        quantity = 20;
      }


      const element =
        document.getElementById(
          "quantity"
        );


      if (element) {

        element.textContent =
          quantity;

      }

    }


    /* =========================
       HANDLE CART
    ========================= */

    function handleAddToCart() {

      if (!product) return;

      addToCart(
        productId,
        quantity
      );

    }


    /* =========================
       HANDLE WHATSAPP
    ========================= */

    function handleWhatsApp(
      event
    ) {

      event.preventDefault();

      if (!product) return;

      buyOnWhatsApp(
        productId,
        quantity
      );

    }


    /* =========================
       RELATED PRODUCTS
    ========================= */

    function renderRelatedProducts() {

      const container =
        document.getElementById(
          "relatedProducts"
        );


      if (!container) return;


      const related =
        Object.entries(products)
          .filter(
            ([id]) =>
              id !== productId
          )
          .slice(0, 3);


      container.innerHTML =
        related.map(
          ([id, item]) => `

            <a
              href="product.html?product=${id}"
              class="related-card"
            >

              <div class="related-image">

                <img
                  src="${item.image}"
                  alt="${item.name}"
                  loading="lazy"
                >

                <span class="related-view">
                  Voir le produit
                </span>

              </div>


              <div class="related-info">

                <span>
                  ${item.category}
                </span>

                <h3>
                  ${item.name}
                </h3>

                <p>
                  ${item.price} DH
                </p>

              </div>

            </a>

          `
        ).join("");

    }


    /* =========================
       START
    ========================= */

    updateCartCount();

    renderProduct();

  </script>

</body>
</html>

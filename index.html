<script>

  const GITHUB_BASE =
    "https://raw.githubusercontent.com/abdorrahman3yw-rgb/zoreva-jewelry/main/";

  /*
    الصور الجديدة فقط:
    - 22 minutes ago
    - 6 hours ago

    صور 3 days ago محذوفة بالكامل.
  */

  const newImages = [

    "2.jpg",
    "71sw32ZElsL._AC_UY1100_.jpg",

    "IMG_20260726_155931.jpg",
    "IMG_20260726_160641.jpg",
    "IMG_20260726_161253.jpg",

    "IMG_20260726_180706.jpg",
    "IMG_20260726_181143.jpg",
    "IMG_20260726_181153.jpg",

    "WhatsApp Image 2026-09-17 at 00.53.02 (1).jpeg",
    "WhatsApp Image 2026-09-17 at 00.53.02.jpeg",

    "WhatsApp Image 2026-09-17 at 00.53.03 (1).jpeg",
    "WhatsApp Image 2026-09-17 at 00.53.03 (2).jpeg",
    "WhatsApp Image 2026-09-17 at 00.53.03 (3).jpeg",
    "WhatsApp Image 2026-09-17 at 00.53.03.jpeg",

    "WhatsApp Image 2026-09-17 at 00.53.04 (1).jpeg",
    "WhatsApp Image 2026-09-17 at 00.53.04 (2).jpeg",
    "WhatsApp Image 2026-09-17 at 00.53.04 (3).jpeg",
    "WhatsApp Image 2026-09-17 at 00.53.04 (4).jpeg",
    "WhatsApp Image 2026-09-17 at 00.53.04 (5).jpeg",
    "WhatsApp Image 2026-09-17 at 00.53.04 (6).jpeg",
    "WhatsApp Image 2026-09-17 at 00.53.04.jpeg",

    "WhatsApp Image 2026-09-17 at 00.53.05 (1).jpeg",
    "WhatsApp Image 2026-09-17 at 00.53.05 (2).jpeg",
    "WhatsApp Image 2026-09-17 at 00.53.05 (3).jpeg",
    "WhatsApp Image 2026-09-17 at 00.53.05 (4).jpeg",
    "WhatsApp Image 2026-09-17 at 00.53.05 (5).jpeg",
    "WhatsApp Image 2026-09-17 at 00.53.05 (6).jpeg",
    "WhatsApp Image 2026-09-17 at 00.53.05 (7).jpeg",
    "WhatsApp Image 2026-09-17 at 00.53.05 (8).jpeg",
    "WhatsApp Image 2026-09-17 at 00.53.05.jpeg",

    "WhatsApp Image 2026-09-17 at 00.53.06 (1).jpeg",
    "WhatsApp Image 2026-09-17 at 00.53.06 (2).jpeg",
    "WhatsApp Image 2026-09-17 at 00.53.06 (3).jpeg",
    "WhatsApp Image 2026-09-17 at 00.53.06 (4).jpeg",
    "WhatsApp Image 2026-09-17 at 00.53.06 (5).jpeg",
    "WhatsApp Image 2026-09-17 at 00.53.06 (6).jpeg",
    "WhatsApp Image 2026-09-17 at 00.53.06 (7).jpeg",
    "WhatsApp Image 2026-09-17 at 00.53.06 (8).jpeg",
    "WhatsApp Image 2026-09-17 at 00.53.06.jpeg",

    "images (2).jpeg",
    "images.jpeg",
    "img_8614-1.webp"

  ];


  /*
    المنتجات الجديدة
  */

  const products = newImages.map((file, index) => {

    return {

      id: index + 1,

      name: `Bijou ${String(index + 1).padStart(2, "0")}`,

      category: "Bijoux",

      price: 149,

      image:
        GITHUB_BASE +
        encodeURIComponent(file).replace(/%2F/g, "/")

    };

  });


  let currentCategory = "all";
  let currentPrice = "all";
  let currentSort = "default";


  /* PRODUCTS */

  function renderProducts(){

    let filtered = [...products];


    if(currentCategory !== "all"){

      filtered = filtered.filter(
        product =>
          product.category === currentCategory
      );

    }


    if(currentPrice === "under120"){

      filtered = filtered.filter(
        product =>
          product.price < 120
      );

    }


    if(currentPrice === "149"){

      filtered = filtered.filter(
        product =>
          product.price === 149
      );

    }


    if(currentSort === "low"){

      filtered.sort(
        (a,b) =>
          a.price - b.price
      );

    }


    if(currentSort === "high"){

      filtered.sort(
        (a,b) =>
          b.price - a.price
      );

    }


    const grid =
      document.getElementById("productsGrid");


    grid.innerHTML = "";


    document
      .getElementById("productsCount")
      .textContent =
      `${filtered.length} produit${filtered.length > 1 ? "s" : ""}`;


    if(filtered.length === 0){

      grid.innerHTML = `

        <div style="
          grid-column:1/-1;
          text-align:center;
          padding:70px 20px;
          color:#777;
          font-size:12px;
        ">
          Aucun produit trouvé.
        </div>

      `;

      return;

    }


    filtered.forEach(product => {

      const card =
        document.createElement("article");


      card.className =
        "product-card";


      card.addEventListener(
        "click",
        () => {

          window.open(
            `product.html?id=${product.id}`,
            "_blank"
          );

        }
      );


      card.innerHTML = `

        <div class="product-image">

          <img
            src="${product.image}"
            alt="${product.name}"
            loading="lazy"
            onerror="this.style.display='none'"
          >

          <button
            class="quick-add"
            data-id="${product.id}"
          >
            Ajouter au panier
          </button>

        </div>


        <div class="product-info">

          <h3>
            ${product.name}
          </h3>

          <div class="product-info-bottom">

            <span class="product-category">
              ${product.category}
            </span>

            <span class="product-price">
              ${product.price} DH
            </span>

          </div>

        </div>

      `;


      grid.appendChild(card);

    });


    document
      .querySelectorAll(".quick-add")
      .forEach(button => {

        button.addEventListener(
          "click",
          event => {

            event.preventDefault();

            event.stopPropagation();


            const id =
              Number(button.dataset.id);


            const product =
              products.find(
                item =>
                  item.id === id
              );


            if(!product) return;


            addToCart(
              product,
              1
            );


            button.textContent =
              "Ajouté";


            setTimeout(
              () => {

                button.textContent =
                  "Ajouter au panier";

              },
              1200
            );

          }
        );

      });

  }


  /* UPDATE FILTER BUTTONS */

  function updateCategoryButtons(){

    document
      .querySelectorAll(".category-filter")
      .forEach(button => {

        button.classList.toggle(
          "active",
          button.dataset.category === currentCategory
        );

      });


    document
      .querySelectorAll(".price-filter")
      .forEach(button => {

        button.classList.toggle(
          "active",
          button.dataset.price === currentPrice
        );

      });


    document
      .querySelectorAll(".sort-filter")
      .forEach(button => {

        button.classList.toggle(
          "active",
          button.dataset.sort === currentSort
        );

      });


    document
      .querySelectorAll(".menu-category-filter")
      .forEach(button => {

        button.classList.toggle(
          "active",
          button.dataset.menuCategory === currentCategory
        );

      });


    document
      .querySelectorAll(".menu-price-filter")
      .forEach(button => {

        button.classList.toggle(
          "active",
          button.dataset.menuPrice === currentPrice
        );

      });


    document
      .querySelectorAll(".menu-sort-filter")
      .forEach(button => {

        button.classList.toggle(
          "active",
          button.dataset.menuSort === currentSort
        );

      });

  }


  /* COLLECTIONS */

  document
    .querySelectorAll(".collection-card")
    .forEach(card => {

      card.addEventListener(
        "click",
        event => {

          event.preventDefault();

          /*
            حيث المنتجات الجديدة مازال ما صنفناهمش
            Bagues / Bracelets / Colliers...
            لذلك Collections حاليا كتفتح المنتجات كاملين.
          */

          currentCategory = "all";
          currentPrice = "all";
          currentSort = "default";

          updateCategoryButtons();

          renderProducts();

          document
            .getElementById("products")
            .scrollIntoView({
              behavior:"smooth"
            });

        }
      );

    });


  /* FILTER PANEL */

  const filterPanel =
    document.getElementById(
      "filterPanel"
    );

  const filterOverlay =
    document.getElementById(
      "filterOverlay"
    );


  function openFilter(){

    filterPanel.classList.add(
      "active"
    );

    filterOverlay.classList.add(
      "active"
    );

  }


  function closeFilter(){

    filterPanel.classList.remove(
      "active"
    );

    filterOverlay.classList.remove(
      "active"
    );

  }


  document
    .getElementById("filterOpen")
    .addEventListener(
      "click",
      openFilter
    );


  document
    .getElementById("filterClose")
    .addEventListener(
      "click",
      closeFilter
    );


  filterOverlay.addEventListener(
    "click",
    closeFilter
  );


  /* CATEGORY FILTER */

  document
    .querySelectorAll(".category-filter")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          currentCategory =
            button.dataset.category;

          updateCategoryButtons();

          renderProducts();

        }
      );

    });


  /* PRICE FILTER */

  document
    .querySelectorAll(".price-filter")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          currentPrice =
            button.dataset.price;

          updateCategoryButtons();

          renderProducts();

        }
      );

    });


  /* SORT */

  document
    .querySelectorAll(".sort-filter")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          currentSort =
            button.dataset.sort;

          updateCategoryButtons();

          renderProducts();

        }
      );

    });


  /* RESET FILTER */

  document
    .getElementById("resetFilter")
    .addEventListener(
      "click",
      () => {

        currentCategory = "all";
        currentPrice = "all";
        currentSort = "default";

        updateCategoryButtons();

        renderProducts();

      }
    );


  /* MENU CATEGORY */

  document
    .querySelectorAll(".menu-category-filter")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          currentCategory =
            button.dataset.menuCategory;

          updateCategoryButtons();

          renderProducts();

        }
      );

    });


  /* MENU PRICE */

  document
    .querySelectorAll(".menu-price-filter")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          currentPrice =
            button.dataset.menuPrice;

          updateCategoryButtons();

          renderProducts();

        }
      );

    });


  /* MENU SORT */

  document
    .querySelectorAll(".menu-sort-filter")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          currentSort =
            button.dataset.menuSort;

          updateCategoryButtons();

          renderProducts();

        }
      );

    });


  /* MENU RESET */

  document
    .getElementById("menuResetFilter")
    .addEventListener(
      "click",
      () => {

        currentCategory = "all";
        currentPrice = "all";
        currentSort = "default";

        updateCategoryButtons();

        renderProducts();

      }
    );


  /* CART */

  let cart =
    JSON.parse(
      localStorage.getItem(
        "zorevaCart"
      )
    ) || [];


  function saveCart(){

    localStorage.setItem(
      "zorevaCart",
      JSON.stringify(cart)
    );

  }


  function updateCartCount(){

    const count =
      cart.reduce(
        (total,item) =>
          total + item.quantity,
        0
      );


    document
      .getElementById("cartCount")
      .textContent =
      count;

  }


  function addToCart(
    product,
    quantity = 1
  ){

    if(!product) return;


    const existing =
      cart.find(
        item =>
          item.id === product.id
      );


    if(existing){

      existing.quantity +=
        quantity;

    }else{

      cart.push({

        id:product.id,

        name:product.name,

        price:product.price,

        image:product.image,

        quantity:quantity

      });

    }


    saveCart();

    updateCartCount();

    renderCart();

  }


  function removeFromCart(id){

    cart =
      cart.filter(
        item =>
          item.id !== id
      );


    saveCart();

    updateCartCount();

    renderCart();

  }


  function renderCart(){

    const container =
      document.getElementById(
        "cartItems"
      );


    if(cart.length === 0){

      container.innerHTML = `

        <div class="cart-empty">
          Votre panier est vide.
        </div>

      `;


      document
        .getElementById("cartTotal")
        .textContent =
        "0 DH";


      return;

    }


    container.innerHTML = "";

    let total = 0;


    cart.forEach(item => {

      const subtotal =
        item.price *
        item.quantity;


      total += subtotal;


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "cart-item";


      div.innerHTML = `

        <img
          src="${item.image}"
          alt="${item.name}"
        >

        <div>

          <h4>
            ${item.name}
          </h4>

          <p>
            ${item.quantity} × ${item.price} DH
          </p>

        </div>

        <button
          class="remove-item"
          onclick="removeFromCart(${item.id})"
        >
          ×
        </button>

      `;


      container.appendChild(
        div
      );

    });


    document
      .getElementById("cartTotal")
      .textContent =
      `${total} DH`;

  }


  /* CART OPEN / CLOSE */

  const cartPanel =
    document.getElementById(
      "cartPanel"
    );

  const cartOverlay =
    document.getElementById(
      "cartOverlay"
    );


  function openCart(){

    cartPanel.classList.add(
      "active"
    );

    cartOverlay.classList.add(
      "active"
    );

  }


  function closeCart(){

    cartPanel.classList.remove(
      "active"
    );

    cartOverlay.classList.remove(
      "active"
    );

  }


  document
    .getElementById("cartBtn")
    .addEventListener(
      "click",
      openCart
    );


  document
    .getElementById("cartClose")
    .addEventListener(
      "click",
      closeCart
    );


  cartOverlay.addEventListener(
    "click",
    closeCart
  );


  /* CHECKOUT WHATSAPP */

  document
    .getElementById("checkoutBtn")
    .addEventListener(
      "click",
      () => {

        if(cart.length === 0){

          alert(
            "Votre panier est vide."
          );

          return;

        }


        let message =
          "Bonjour ZOREVA, je souhaite passer une commande :\n\n";


        let total = 0;


        cart.forEach(item => {

          const subtotal =
            item.price *
            item.quantity;


          total += subtotal;


          message +=
            `${item.name} — ${item.quantity} × ${item.price} DH = ${subtotal} DH\n`;

        });


        message +=
          `\nTotal : ${total} DH`;


        window.open(
          "https://wa.me/212765333754?text=" +
          encodeURIComponent(message),
          "_blank"
        );

      }
    );


  /* MENU */

  const menuBtn =
    document.getElementById(
      "menuBtn"
    );

  const menuClose =
    document.getElementById(
      "menuClose"
    );

  const sideMenu =
    document.getElementById(
      "sideMenu"
    );

  const menuOverlay =
    document.getElementById(
      "menuOverlay"
    );


  function openMenu(){

    sideMenu.classList.add(
      "active"
    );

    menuOverlay.classList.add(
      "active"
    );

  }


  function closeMenu(){

    sideMenu.classList.remove(
      "active"
    );

    menuOverlay.classList.remove(
      "active"
    );

  }


  menuBtn.addEventListener(
    "click",
    openMenu
  );


  menuClose.addEventListener(
    "click",
    closeMenu
  );


  menuOverlay.addEventListener(
    "click",
    closeMenu
  );


  /* INITIALIZE */

  renderProducts();

  updateCategoryButtons();

  updateCartCount();

  renderCart();

</script>
